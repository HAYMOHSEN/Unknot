/* Layout: a quiet instrument panel. Left rail for navigation, one working column,
   and a full-screen dark focus mode where the breath trace takes over the screen. */
:root{
  /* palette: mist paper, deep lagoon ink, sand for the exhale */
  --bg:#ECF1F0; --surface:#FAFCFB; --sunk:#E3EAE9; --ink:#11262B; --ink-2:#3D5359; --muted:#66797E;
  --line:#D3DDDB; --line-2:#BCCAC8;
  --accent:#16656F; --accent-2:#0F4F57; --accent-soft:#D6EAEC; --on-accent:#FFFFFF;
  --sand:#E9DCC5; --sand-ink:#6A5330;
  --calm:#2A8A8F; --mid:#C99327; --high:#C2465E;
  --ev-strong:#2E7A4E; --ev-moderate:#2F67A8; --ev-emerging:#A06A14; --ev-practice:#6B777C;
  --danger:#B23B4E; --danger-soft:#F6E1E4;
  --focus-bg:#0B1A1E; --focus-bg-2:#122A30; --focus-fg:#E4F0EE; --focus-dim:#93ACAE; --focus-line:#21414A;
  --trace:#7FD3D6; --exhale:#E7C893; --hold:#C9D6D8;
  --shadow:0 1px 2px rgba(17,38,43,.05),0 10px 30px rgba(17,38,43,.06);
  /* type */
  --font-display:"Newsreader","Readex Pro",Georgia,"Times New Roman",serif;
  --font-ui:"Readex Pro","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",Tahoma,sans-serif;
  --fs-xs:12.5px; --fs-s:13.5px; --fs-m:15px; --fs-l:17px; --fs-xl:21px; --fs-2xl:27px; --fs-3xl:36px; --fs-4xl:44px;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --rail:248px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1417; --surface:#111D21; --sunk:#0E181B; --ink:#E1ECEA; --ink-2:#B5C6C5; --muted:#869A9E;
    --line:#203039; --line-2:#2C414A;
    --accent:#5DBEC6; --accent-2:#8AD5DB; --accent-soft:#11333A; --on-accent:#04201F;
    --sand:#3A3225; --sand-ink:#E5D4B5;
    --calm:#4FB3B7; --mid:#E0AE4A; --high:#E36A82;
    --ev-strong:#63C08A; --ev-moderate:#77ABEB; --ev-emerging:#E2B05A; --ev-practice:#9CA8AE;
    --danger:#E8687C; --danger-soft:#3A1D23;
    --focus-bg:#071316; --focus-bg-2:#0F2429; --focus-line:#1C3A42;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1417; --surface:#111D21; --sunk:#0E181B; --ink:#E1ECEA; --ink-2:#B5C6C5; --muted:#869A9E;
  --line:#203039; --line-2:#2C414A;
  --accent:#5DBEC6; --accent-2:#8AD5DB; --accent-soft:#11333A; --on-accent:#04201F;
  --sand:#3A3225; --sand-ink:#E5D4B5;

}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:var(--fs-m);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:lang(ar) body,body:lang(ar){line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.session :focus-visible{outline-color:var(--trace)}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:16px;height:16px}
.ico.l{width:24px;height:24px}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px 18px;background:var(--sunk);border-inline-end:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--font-display);font-size:24px;font-weight:550;letter-spacing:-.01em;line-height:1}
.brand-tag{display:block;font-family:var(--font-ui);font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-top:4px;font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:14.5px;font-weight:450}
.nav a:hover{background:color-mix(in oklab,var(--accent-soft) 55%,transparent);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:550}
.nav .badge{margin-inline-start:auto;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;line-height:1.5}
.rail-spacer{flex:1}
.rail-sos{margin-top:12px}
.main{min-width:0;padding:34px clamp(16px,4vw,52px) 72px;outline:none}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.topbar{display:none}
.tabbar{display:none}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 16px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;margin-inline-end:auto}
  .topbar .brand-name{font-size:21px}
  .topbar .brand-mark{width:28px;height:28px}
  .topbar .brand-tag{display:none}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:11px;border-radius:10px;min-width:0}
  .tabbar a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:550}
  .main{padding:18px 16px 110px}
  .wrap{gap:22px}
}

/* ---------- type ---------- */
.eyebrow{font-size:var(--fs-xs);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
:lang(ar) .eyebrow{letter-spacing:0;text-transform:none;font-size:var(--fs-s)}
.page-head{display:flex;flex-direction:column;gap:8px;max-width:760px}
.page-head h1{font-family:var(--font-display);font-size:var(--fs-4xl);line-height:1.08;letter-spacing:-.015em}
:lang(ar) .page-head h1{font-size:var(--fs-3xl);font-weight:600;letter-spacing:0;line-height:1.3}
.lead{font-size:var(--fs-l);color:var(--ink-2);max-width:62ch}
.h2{font-family:var(--font-display);font-size:var(--fs-2xl);line-height:1.2;letter-spacing:-.01em}
:lang(ar) .h2{font-size:var(--fs-xl);font-weight:600;letter-spacing:0;line-height:1.45}
.h3{font-family:var(--font-display);font-size:var(--fs-xl);line-height:1.25;font-weight:520}
:lang(ar) .h3{font-size:var(--fs-l);font-weight:600;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:var(--fs-s)}
.xs{font-size:var(--fs-xs)}
.num{font-family:var(--font-display);font-feature-settings:"tnum" 1,"lnum" 1}
@media (max-width:880px){
  .page-head h1{font-size:34px}
  :lang(ar) .page-head h1{font-size:28px}
}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid-2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.grid-2,.grid-2.even{grid-template-columns:minmax(0,1fr)}}
.section{display:flex;flex-direction:column;gap:14px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);border:0;margin:4px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.big{min-height:52px;padding:0 26px;font-size:var(--fs-l);border-radius:14px}
.btn.sm{min-height:34px;padding:0 12px;font-size:var(--fs-s);border-radius:10px}
.btn.icon{padding:0;width:42px}
.btn.sm.icon{width:34px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:var(--fs-s);cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-size:var(--fs-s);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:550}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:var(--fs-s);color:var(--ink-2);font-weight:500}
.input,.textarea,.select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);min-height:42px}
.textarea{min-height:110px;resize:vertical;line-height:1.6}
.input:focus,.textarea:focus,.select:focus{outline:2px solid color-mix(in oklab,var(--accent) 60%,transparent);outline-offset:0;border-color:var(--accent)}
.switch{position:relative;width:44px;height:26px;flex:none;border-radius:999px;background:var(--line-2);border:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-18px)}
input[type="range"]{accent-color:var(--accent);width:100%}

/* ---------- stress scale 0-10 ---------- */
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;direction:ltr}
.scale button{height:44px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-weight:550;cursor:pointer;font-size:var(--fs-m);padding:0;font-family:var(--font-display);font-feature-settings:"lnum" 1}
.scale button:hover{border-color:var(--ink-2)}
.scale button.on{background:var(--lv);border-color:var(--lv);color:#fff}
.scale button[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--lv)}
.scale-ends{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);direction:ltr}
.scale-ends span:last-child{text-align:end}
.scale-word{font-size:var(--fs-s);color:var(--ink-2);min-height:1.5em}
.session .scale button{background:transparent;border-color:var(--focus-line);color:var(--focus-fg);height:52px}
.session .scale button.on{background:var(--lv);border-color:var(--lv);color:#fff}
.session .scale button[aria-checked="true"]{box-shadow:0 0 0 2px var(--focus-bg),0 0 0 4px var(--lv)}
.session .scale-ends{color:var(--focus-dim)}
@media (max-width:480px){.scale button{height:40px;font-size:var(--fs-s)}.scale{gap:3px}}

/* ---------- evidence badge ---------- */
.ev{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-xs);font-weight:550;color:var(--evc);white-space:nowrap}
.ev .pips{display:inline-flex;gap:2px}
.ev .pips i{width:6px;height:12px;border-radius:2px;background:color-mix(in oklab,var(--evc) 20%,transparent)}
.ev[data-lv="strong"]{--evc:var(--ev-strong)}
.ev[data-lv="moderate"]{--evc:var(--ev-moderate)}
.ev[data-lv="emerging"]{--evc:var(--ev-emerging)}
.ev[data-lv="practice"]{--evc:var(--ev-practice)}
.ev[data-lv="strong"] .pips i{background:var(--evc)}
.ev[data-lv="moderate"] .pips i:nth-child(-n+3){background:var(--evc)}
.ev[data-lv="emerging"] .pips i:nth-child(-n+2){background:var(--evc)}
.ev[data-lv="practice"] .pips i:nth-child(1){background:var(--evc)}
.ev.big{font-size:var(--fs-s)}
.ev.big .pips i{width:8px;height:16px}

/* ---------- tool cards ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tgrid.q4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tgrid.q3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1180px){.tgrid.q4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.tgrid.q3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.tgrid.q4{grid-template-columns:minmax(0,1fr)}}
.sos-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:q}
.sos-steps li{counter-increment:q;display:flex;align-items:center;gap:10px;color:var(--focus-fg);font-size:var(--fs-s)}
.sos-steps li::before{content:counter(q);width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--focus-line);display:grid;place-items:center;font-size:12px;color:var(--trace);font-family:var(--font-display);font-weight:600}
.tcard{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0}
.tcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.tcat{display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
:lang(ar) .tcat{letter-spacing:0;text-transform:none}
.tcat .ico{color:var(--accent)}
.tname{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:520;line-height:1.2}
:lang(ar) .tname{font-size:var(--fs-l);font-weight:600;line-height:1.45}
.tshort{color:var(--ink-2);font-size:var(--fs-s);flex:1}
.tmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line)}
.dur{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--ink-2)}
.tcard .why{font-size:var(--fs-s);color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:8px 10px}
.pin-dot{color:var(--accent)}

/* ---------- today ---------- */
.hello{display:flex;flex-direction:column;gap:6px}
.sos-card{background:var(--focus-bg);color:var(--focus-fg);border:1px solid var(--focus-line);position:relative;overflow:hidden;justify-content:space-between}
.sos-card .eyebrow{color:var(--focus-dim)}
.sos-card p{color:var(--focus-dim)}
.sos-card .h2{color:var(--focus-fg)}
.sos-card .btn.primary{background:var(--trace);border-color:var(--trace);color:#06272A}
.sos-card .btn.primary:hover{background:#A3E3E5;border-color:#A3E3E5}
.sos-wave{position:absolute;inset-inline:0;bottom:0;height:70px;opacity:.55;pointer-events:none}
.sos-card > *:not(.sos-wave){position:relative}
.states{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:980px){.states{grid-template-columns:repeat(2,minmax(0,1fr))}}
.state{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;color:var(--ink);font-size:var(--fs-s);line-height:1.35;min-height:58px}
.state .ico{color:var(--accent);flex:none}
.state:hover{border-color:var(--accent)}
.state[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.recs{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r-l);background:var(--sunk);border:1px solid var(--line)}
.recs-note{color:var(--ink-2);max-width:72ch}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--sunk);min-width:0}
.stat b{font-family:var(--font-display);font-size:28px;font-weight:500;line-height:1.1;font-feature-settings:"tnum" 1,"lnum" 1}
.stat span{font-size:var(--fs-xs);color:var(--muted)}
.tip{display:flex;flex-direction:column;gap:10px}
.tip blockquote{margin:0;font-family:var(--font-display);font-size:var(--fs-xl);line-height:1.35;font-weight:420}
:lang(ar) .tip blockquote{font-size:var(--fs-l);line-height:1.7;font-weight:500}
.banner{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:var(--r-l);background:var(--accent-soft);border:1px solid color-mix(in oklab,var(--accent) 35%,transparent)}
.banner .ico{color:var(--accent);margin-top:2px}
.banner > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.check-item input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.check-item.done span{text-decoration:line-through;color:var(--muted)}

/* ---------- tools page ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1;min-width:200px;max-width:320px}
.search .ico{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-inline-start:36px}
.cat-head{display:flex;align-items:center;gap:10px;margin-top:6px}
.cat-head .ico{color:var(--accent)}
.empty{padding:28px;border:1px dashed var(--line-2);border-radius:var(--r-l);text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* ---------- tool detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-size:var(--fs-s);width:max-content}
.back:hover{color:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:22px;align-items:start}
@media (max-width:980px){.detail{grid-template-columns:minmax(0,1fr)}}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:600;font-size:15px}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin:0}
.kv dt{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
:lang(ar) .kv dt{text-transform:none;letter-spacing:0;font-size:var(--fs-s)}
.kv dd{margin:0 0 10px;color:var(--ink-2)}
.start-panel{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
.caution{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--sand);color:var(--sand-ink);font-size:var(--fs-s)}
.caution .ico{flex:none;margin-top:2px}
.refs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:var(--fs-s);color:var(--ink-2)}
.refs li{padding-inline-start:14px;border-inline-start:2px solid var(--line-2);direction:ltr;text-align:left}
.refs .rt{font-size:var(--fs-xs);color:var(--muted);display:block;margin-top:2px}
.my-results{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--font-display);font-size:24px;font-feature-settings:"lnum" 1,"tnum" 1;direction:ltr}

/* ---------- insights ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-family:var(--font-display);font-size:32px;font-weight:500;line-height:1.05;font-feature-settings:"tnum" 1,"lnum" 1;direction:ltr;text-align:start}
.kpi span{font-size:var(--fs-xs);color:var(--muted)}
.chart{width:100%;overflow-x:auto;direction:ltr}
.chart svg{display:block}
.chart text{font-family:var(--font-ui);fill:var(--muted);font-size:11px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.6rem;gap:10px;align-items:center;font-size:var(--fs-s)}
.bar-row .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-track{display:block;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar-row .bv{font-feature-settings:"tnum" 1;text-align:end;color:var(--ink);font-weight:550;direction:ltr}
.demo-flag{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--sand);color:var(--sand-ink);font-size:var(--fs-s)}

/* ---------- science ---------- */
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.legend{grid-template-columns:minmax(0,1fr)}}
.legend > div{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.sci-item{border-top:1px solid var(--line);padding:18px 0;display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr);gap:18px}
.sci-item:first-child{border-top:0}
@media (max-width:760px){.sci-item{grid-template-columns:minmax(0,1fr);gap:8px}}
.sci-item h3 a{color:var(--ink);text-decoration:none}
.sci-item h3 a:hover{color:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-size:var(--fs-s);font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details[open] summary .chev{transform:rotate(90deg)}
[dir="rtl"] details summary .chev{transform:scaleX(-1)}
[dir="rtl"] details[open] summary .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}
.myth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.myth:first-of-type{border-top:0}
@media (max-width:760px){.myth{grid-template-columns:minmax(0,1fr)}}
.myth s{color:var(--muted);text-decoration-thickness:1px}

/* ---------- help ---------- */
.urgent{border:1.5px solid var(--danger);background:color-mix(in oklab,var(--danger-soft) 70%,var(--surface))}
.urgent .h2{color:var(--danger)}
.bul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.big-num{font-family:var(--font-display);font-size:30px;font-weight:550;letter-spacing:.01em;direction:ltr;display:inline-block}

/* ---------- settings ---------- */
.set-group{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row > div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px}
.set-row .muted{font-size:var(--fs-s)}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--danger-soft);border:1px solid var(--danger)}
.kbd{display:inline-block;padding:1px 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--sunk);font-size:12px;font-family:ui-monospace,Consolas,monospace;direction:ltr}

/* ---------- journal ---------- */
.entry{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kind{font-size:var(--fs-xs);padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:550}
.entry-body{white-space:pre-wrap;color:var(--ink-2);overflow-wrap:anywhere}
.entry-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- toast ---------- */
.toast{position:fixed;inset-inline:0;bottom:24px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:var(--fs-s);box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.reminder{position:fixed;inset-inline-end:20px;bottom:20px;z-index:70;width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.session:not([hidden]) ~ .toast{bottom:96px}
@media (max-width:880px){.toast{bottom:92px}.reminder{bottom:88px;inset-inline-end:16px}}

/* ---------- focus mode (session) ---------- */
.session{position:fixed;inset:0;z-index:60;background:var(--focus-bg);color:var(--focus-fg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.s-top{display:flex;align-items:center;gap:10px;width:100%;max-width:1040px;margin:0 auto}
.s-title{display:flex;flex-direction:column;min-width:0;flex:1}
.s-title b{font-family:var(--font-display);font-size:var(--fs-l);font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:lang(ar) .s-title b{font-weight:600}
.s-title span{font-size:var(--fs-xs);color:var(--focus-dim);font-feature-settings:"tnum" 1}
.s-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--focus-line);background:transparent;color:var(--focus-fg);cursor:pointer}
.s-btn:hover{background:var(--focus-bg-2)}
.s-btn[aria-pressed="false"]{color:var(--focus-dim)}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0;overflow-y:auto;padding:16px 0;width:100%;max-width:1040px;margin:0 auto}
.stage.top{justify-content:flex-start}
.s-bottom{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;width:100%;max-width:1040px;margin:0 auto;min-height:48px}
.session .btn{background:transparent;border-color:var(--focus-line);color:var(--focus-fg)}
.session .btn:hover{background:var(--focus-bg-2);border-color:var(--focus-dim);color:var(--focus-fg)}
.session .btn.primary{background:var(--trace);border-color:var(--trace);color:#06272A}
.session .btn.primary:hover{background:#A3E3E5;border-color:#A3E3E5;color:#06272A}
.session .btn.ghost{border-color:transparent}
.session .muted{color:var(--focus-dim)}
.session .chip{background:transparent;border-color:var(--focus-line);color:var(--focus-fg)}
.session .chip:hover{border-color:var(--trace)}
.session .chip[aria-pressed="true"]{background:var(--trace);border-color:var(--trace);color:#06272A}
.session .input,.session .textarea,.session .select{background:var(--focus-bg-2);border-color:var(--focus-line);color:var(--focus-fg)}
.session .input::placeholder,.session .textarea::placeholder{color:color-mix(in oklab,var(--focus-dim) 75%,transparent)}
.session .input:focus,.session .textarea:focus{outline-color:color-mix(in oklab,var(--trace) 60%,transparent);border-color:var(--trace)}
.session .label{color:var(--focus-dim)}
.session .seg{background:var(--focus-bg-2);border-color:var(--focus-line)}
.session .seg button{color:var(--focus-dim)}
.session .seg button[aria-pressed="true"]{background:var(--focus-line);color:var(--focus-fg)}
.s-q{font-family:var(--font-display);font-size:clamp(26px,4vw,40px);line-height:1.2;text-align:center;max-width:24ch;font-weight:450}
:lang(ar) .s-q{font-size:clamp(22px,3.4vw,32px);font-weight:600;line-height:1.5}
.s-p{color:var(--focus-dim);text-align:center;max-width:58ch;font-size:var(--fs-l)}
.s-panel{width:min(680px,100%);display:flex;flex-direction:column;gap:16px}
.s-panel.wide{width:min(900px,100%)}
.s-card{background:var(--focus-bg-2);border:1px solid var(--focus-line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.s-card h3{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:500}
:lang(ar) .s-card h3{font-size:var(--fs-l);font-weight:600}
.s-steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.s-steps i{width:24px;height:4px;border-radius:2px;background:var(--focus-line)}
.s-steps i.done{background:var(--trace)}
.s-steps i.now{background:var(--focus-fg)}

/* breath pacer */
.pacer{width:min(980px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.phase{font-family:var(--font-display);font-size:clamp(34px,6vw,60px);line-height:1.08;text-align:center;font-weight:420;min-height:1.1em;transition:color .4s}
:lang(ar) .phase{font-size:clamp(30px,5vw,48px);font-weight:600;line-height:1.35}
.phase-sub{color:var(--focus-dim);font-size:var(--fs-l);min-height:1.6em;text-align:center}
.trace-wrap{position:relative;width:100%;direction:ltr}
canvas.trace{display:block;width:100%;height:clamp(170px,34vh,310px)}
.pacer-meta{display:flex;gap:18px;justify-content:center;color:var(--focus-dim);font-size:var(--fs-s);font-feature-settings:"tnum" 1;flex-wrap:wrap}
.pacer-meta b{color:var(--focus-fg);font-weight:500}
.simple-bar{width:min(520px,90%);height:16px;border-radius:999px;background:var(--focus-bg-2);border:1px solid var(--focus-line);overflow:hidden;direction:ltr}
.simple-bar span{display:block;height:100%;background:var(--trace);border-radius:999px;transform-origin:left center}

/* ring timer for steps */
.ring{position:relative;width:min(220px,50vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rbg{stroke:var(--focus-line)}
.ring .rfg{stroke:var(--trace);transition:stroke .3s}
.ring.tense .rfg{stroke:var(--exhale)}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-c b{font-family:var(--font-display);font-size:48px;font-weight:420;font-feature-settings:"tnum" 1,"lnum" 1;line-height:1}
.ring-c span{display:block;font-size:var(--fs-s);color:var(--focus-dim);margin-top:4px}
.step-title{font-family:var(--font-display);font-size:clamp(26px,4vw,40px);font-weight:450;text-align:center;line-height:1.2}
:lang(ar) .step-title{font-size:clamp(22px,3.4vw,32px);font-weight:600;line-height:1.5}
.step-text{color:var(--focus-dim);text-align:center;max-width:56ch;font-size:var(--fs-l);min-height:3.2em}

/* grounding */
.ground-dots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.gdot{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--focus-line);background:transparent;color:var(--focus-dim);cursor:pointer;font-family:var(--font-display);font-size:22px;display:grid;place-items:center}
.gdot:hover{border-color:var(--trace)}
.gdot[aria-pressed="true"]{background:var(--trace);border-color:var(--trace);color:#06272A}
.big-n{font-family:var(--font-display);font-size:96px;line-height:.9;font-weight:380;color:var(--trace);font-feature-settings:"lnum" 1}

/* result */
.result-delta{display:flex;align-items:center;gap:18px;font-family:var(--font-display);font-size:64px;font-weight:400;font-feature-settings:"lnum" 1,"tnum" 1;direction:ltr}
.result-delta .ico{width:36px;height:36px;color:var(--focus-dim)}
.shred{animation:shred .9s ease-in forwards}
@keyframes shred{to{opacity:0;transform:translateY(40px) scaleY(.2);filter:blur(4px)}}
.confirm-end{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px 14px;border-radius:14px;background:var(--focus-bg-2);border:1px solid var(--focus-line)}

/* worry & control lists */
.wlist{display:flex;flex-direction:column;gap:8px;width:100%}
.witem{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;background:var(--focus-bg-2);border:1px solid var(--focus-line);overflow-wrap:anywhere}
.witem > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:620px){.zones{grid-template-columns:minmax(0,1fr)}}
.zone-btn{padding:10px;border-radius:12px;border:1px solid var(--focus-line);background:transparent;color:var(--focus-fg);cursor:pointer;text-align:start;font-size:var(--fs-s);line-height:1.35}
.zone-btn b{display:block;font-weight:550;margin-bottom:2px}
.zone-btn[aria-pressed="true"]{border-color:var(--trace);background:color-mix(in oklab,var(--trace) 16%,transparent)}
.emo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.emo{padding:12px;border-radius:12px;border:1px solid var(--focus-line);background:transparent;color:var(--focus-fg);cursor:pointer;text-align:start;font-size:var(--fs-m)}
.emo:hover{border-color:var(--trace)}
.emo[aria-pressed="true"]{background:var(--trace);border-color:var(--trace);color:#06272A}
.nature-viz{width:min(560px,100%);aspect-ratio:2.2;border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 50% 110%,color-mix(in oklab,var(--trace) 30%,transparent),transparent 60%),var(--focus-bg-2);border:1px solid var(--focus-line);max-width:100%}
.nature-viz canvas{width:100%;height:100%;display:block}
.writing{width:min(820px,100%);min-height:min(48vh,440px);font-size:var(--fs-l);line-height:1.75;padding:18px 20px}
.template{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--focus-bg-2);border:1px solid var(--focus-line)}
.template p{flex:1;min-width:0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media print{.rail,.tabbar,.topbar{display:none}}

  ar:{ name:"التنهّد الدوري", short:"شهيقان من الأنف، ثم زفير طويل من الفم.",
    best:"تهدئة الجسد المستنفَر بسرعة: قلب متسارع، ضيق في الصدر، ارتجاف في اليدين.",
    steps:["اجلس أو قِف بارتياح وأرخِ كتفيك.","خذ شهيقاً من أنفك حتى تشعر بأن رئتيك امتلأتا تقريباً.","دون أن تزفر، خذ رشفة هواء ثانية أقصر من أنفك لتملأهما تماماً.","ازفر ببطء من فمك حتى آخر النفَس، لمدة تقارب ضعف مدة الشهيق.","كرّر بإيقاع مريح. اختبرت الدراسة خمس دقائق يومياً، وبضع دورات تكفي لإعادة ضبط سريعة."],
    why:"الزفير الطويل البطيء يبطئ القلب عبر العصب المبهم، وهو جزء من جهاز «الراحة والهضم» في الجسم. والرشفة الثانية تملأ الرئتين بالكامل كما تفعل التنهيدة الطبيعية، فيسهل الزفير الطويل بعدها.",
    evidence:"في دراسة عشوائية على 108 أشخاص استمرت شهراً، حسّنت خمس دقائق يومياً من التنهّد الدوري المزاجَ الإيجابي وأبطأت التنفّس أثناء الراحة أكثر مما فعل تمرين لليقظة الذهنية [[Balban et al., 2023]]. هي تجربة واحدة صغيرة، لذا نصنّف الدليل ناشئاً. وعبر 12 تجربة عشوائية، خفّضت تمارين التنفّس التوتر الذي يصفه المشاركون بقدر صغير إلى متوسط [[Fincham et al., 2023]].",
    caution:"إذا شعرت بدوار أو تنميل، عُد إلى تنفّسك الطبيعي. اجعل أنفاسك هادئة ولا تُجهد نفسك." } },

{ id:"resonance", cat:"body", icon:"waves", ev:"moderate", runner:"breath", pattern:"resonance", len:[3,5,10], def:5, mins:[3,10], refs:["laborde2022","zaccaro2018","fincham2023","goessl2017","lehrer2014"],
  en:{ name:"Resonance breathing", short:"About six slow breaths a minute, with a longer exhale.",
    best:"Daily practice to lower your baseline stress; also before sleep or a hard conversation.",
    steps:["Sit upright with your feet on the floor. Breathe through your nose if you can.","Follow the guide: in for about 4 seconds, out for about 6. That's six breaths a minute.","Let your belly expand as you breathe in. Keep the breath soft and quiet rather than big.","If the pace feels like a strain, pick a faster setting. Comfort matters more than the exact number.","Practise for 5–10 minutes, once or twice a day."],
    why:"At around six breaths a minute (for most adults, somewhere between 4.5 and 6.5), heart rate rises and falls in step with your breathing. This resonance strengthens heart rate variability, a sign of how flexibly your nervous system shifts into recovery.",
    evidence:"While you practise, slow breathing raises heart rate variability, most of all at about six breaths a minute [[Laborde et al., 2022]]. Across 12 randomized trials, breathing practices reduced self-reported stress by a small-to-medium amount [[Fincham et al., 2023]]. Training this pace with heart-rate biofeedback was followed by large drops in stress and anxiety [[Goessl et al., 2017]]; without biofeedback, as here, expect more modest effects.",
    caution:"Stop if you feel light-headed. Breathe slowly, not deeply: slow is the goal, not big." },
  ar:{ name:"تنفّس الرنين", short:"نحو ست أنفاس بطيئة في الدقيقة، بزفير أطول.",
    best:"ممارسة يومية لخفض مستوى توترك العام، وكذلك قبل النوم أو قبل محادثة صعبة.",
    steps:["اجلس منتصباً وقدماك على الأرض، وتنفّس من أنفك إن استطعت.","اتبع الدليل: شهيق لنحو 4 ثوانٍ، وزفير لنحو 6 ثوانٍ، أي ست أنفاس في الدقيقة.","دَع بطنك يتّسع مع الشهيق، واجعل نفَسك ناعماً هادئاً لا كبيراً.","إن شعرت بأن الإيقاع مُجهِد، اختر إعداداً أسرع؛ الراحة أهم من الرقم الدقيق.","مارسه من 5 إلى 10 دقائق، مرة أو مرتين يومياً."],
    why:"عند التنفّس بمعدل ست مرات تقريباً في الدقيقة (بين 4.5 و6.5 لدى معظم البالغين)، يرتفع معدل ضربات القلب وينخفض متناغماً مع أنفاسك. هذا «الرنين» يعزّز تقلّب معدل ضربات القلب، وهو مؤشر على مرونة جهازك العصبي في الانتقال إلى حالة التعافي.",
    evidence:"أثناء الممارسة، يرفع التنفّس البطيء تقلّب معدل ضربات القلب، وأكثر ما يرفعه عند نحو ست أنفاس في الدقيقة [[Laborde et al., 2022]]. وعبر 12 تجربة عشوائية، خفّضت تمارين التنفّس التوتر الذي يصفه المشاركون بقدر صغير إلى متوسط [[Fincham et al., 2023]]. وحين تدرّب الناس على هذا الإيقاع مع الارتجاع البيولوجي لنبض القلب، انخفض التوتر والقلق بشكل كبير [[Goessl et al., 2017]]؛ أما دون ارتجاع بيولوجي، كما هنا، فتوقّع آثاراً أكثر تواضعاً.",
    caution:"توقّف إذا شعرت بدوار خفيف. تنفّس ببطء لا بعمق: الهدف هو البطء، لا الحجم." } },

{ id:"box", cat:"body", icon:"box", ev:"emerging", runner:"breath", pattern:"box", len:[2,3,5], def:3, mins:[2,5], refs:["mcallister2026","balban2023"],
  en:{ name:"Box breathing", short:"In, hold, out, hold: four counts each.",
    best:"Steadying your focus under pressure, when counting helps keep your mind on task.",
    steps:["Breathe in through your nose for 4 counts.","Hold gently for 4.","Breathe out through your mouth for 4.","Hold for 4, then repeat. Shorten to 3 counts if 4 feels like too much."],
    why:"Counting and short pauses slow your breathing and give your mind a simple rhythm to follow, which crowds out racing thoughts.",
    evidence:"Widely taught in military and first-responder training. In a randomized trial of 66 adults, five minutes of 4-4-4-4 box breathing before a stressful speech task blunted the rise in heart rate and in a salivary stress marker, compared with normal breathing [[McAllister et al., 2026]]. People practising a box-style pattern daily for a month also felt better after each session [[Balban et al., 2023]]. Both studies are small, so we mark it emerging.",
    caution:"Skip the holds if you're pregnant, have a heart or lung condition, or feel uncomfortable. Simply breathe in for 4 and out for 4 instead." },
  ar:{ name:"التنفّس المربّع", short:"شهيق، حبس، زفير، حبس: أربع عدّات لكل مرحلة.",
    best:"تثبيت تركيزك تحت الضغط، حين يساعدك العدّ على إبقاء ذهنك في المهمة.",
    steps:["خذ شهيقاً من أنفك لأربع عدّات.","احبس نفَسك بلطف لأربع عدّات.","ازفر من فمك لأربع عدّات.","احبس لأربع عدّات، ثم كرّر. قلّلها إلى ثلاث إن شعرت بأن أربعاً كثيرة."],
    why:"العدّ والتوقّفات القصيرة تبطئ تنفّسك وتمنح ذهنك إيقاعاً بسيطاً يتبعه، فتزاحم الأفكارَ المتسارعة.",
    evidence:"يُدرَّس على نطاق واسع في تدريب العسكريين وفرق الطوارئ. في تجربة عشوائية على 66 بالغاً، خفّفت خمس دقائق من التنفّس المربّع (4-4-4-4) قبل مهمة خطابة مُجهِدة ارتفاعَ معدل ضربات القلب وأحد مؤشرات التوتر في اللعاب مقارنةً بالتنفّس العادي [[McAllister et al., 2026]]. كما شعر من مارسوا نمطاً مشابهاً يومياً لمدة شهر بتحسّن بعد كل جلسة [[Balban et al., 2023]]. الدراستان صغيرتان، لذا نصنّف الدليل ناشئاً.",
    caution:"تجنّب فترات الحبس إذا كنتِ حاملاً أو كنت تعاني من مرض في القلب أو الرئتين أو شعرت بعدم الارتياح، واكتفِ بشهيق لأربع وزفير لأربع." } },

{ id:"pmr", cat:"body", icon:"body", ev:"moderate", runner:"steps", mins:[4,4], refs:["manzoni2008","toussaint2021","jacobson1938"],
  en:{ name:"Progressive muscle relaxation", short:"Tense, then release, one muscle group at a time.",
    best:"Body tension, a clenched jaw or tight shoulders, and trouble winding down at night.",
    steps:["Sit or lie down. Breathe normally throughout and don't hold your breath while tensing.","Tense one muscle group firmly, at about half your strength, for 5–7 seconds.","Release all at once and notice the difference for 15–20 seconds.","Move through the body: hands, arms, shoulders, face, back, belly, legs, feet.","Finish by letting your whole body feel heavy and supported."],
    why:"Deliberately tensing a muscle makes its release easier to feel. With practice you learn to notice tension early and let it go on cue.",
    evidence:"Developed by the physician Edmund Jacobson in the 1920s and 1930s and tested in many trials since. A meta-analysis of relaxation training, including progressive relaxation, found it reduced anxiety by about half a standard deviation, a medium effect [[Manzoni et al., 2008]]. In a randomized lab study of 60 students, a single 20-minute session increased feelings of relaxation [[Toussaint et al., 2021]].",
    caution:"Skip any area that's injured or painful, and never tense to the point of pain or cramping. If you have high blood pressure, back problems or a recent injury, check with your doctor first." },
  ar:{ name:"الإرخاء العضلي التدريجي", short:"شُدّ ثم أرخِ، مجموعة عضلية تلو الأخرى.",
    best:"توتّر الجسد، وانقباض الفك أو تشنّج الكتفين، وصعوبة الاسترخاء ليلاً.",
    steps:["اجلس أو استلقِ، وتنفّس بشكل طبيعي طوال التمرين، ولا تحبس نفَسك أثناء الشدّ.","شُدّ مجموعة عضلية بقوة، بنحو نصف طاقتك، لمدة 5 إلى 7 ثوانٍ.","أرخِها دفعة واحدة، ولاحظ الفرق لمدة 15 إلى 20 ثانية.","تنقّل عبر جسدك: اليدان، والذراعان، والكتفان، والوجه، والظهر، والبطن، والساقان، والقدمان.","اختم بترك جسدك كله يشعر بالثقل والسند."],
    why:"شدّ العضلة عمداً يجعل الإحساس بارتخائها أوضح. ومع التمرين تتعلّم ملاحظة التوتر مبكراً والتخلّص منه عند الحاجة.",
    evidence:"طوّره الطبيب إدموند جاكوبسون في عشرينيات القرن الماضي وثلاثينياته، واختُبر في تجارب كثيرة منذ ذلك الحين. وجد تحليل تجميعي لتدريبات الاسترخاء، ومنها الإرخاء التدريجي، أنها خفّضت القلق بنحو نصف انحراف معياري، وهو أثر متوسط [[Manzoni et al., 2008]]. وفي دراسة مخبرية عشوائية على 60 طالباً، رفعت جلسة واحدة مدتها 20 دقيقة الإحساس بالاسترخاء [[Toussaint et al., 2021]].",
    caution:"تجنّب أي منطقة مصابة أو مؤلمة، ولا تشُدّ إلى حدّ الألم أو التشنّج. وإذا كنت تعاني من ارتفاع ضغط الدم أو مشكلات في الظهر أو إصابة حديثة، فاستشر طبيبك أولاً." } },

{ id:"bodyscan", cat:"body", icon:"scan", ev:"practice", runner:"steps", mins:[4,6], refs:["goyal2014","khoury2015","gan2022"],
  en:{ name:"Body scan", short:"Move your attention slowly from your feet to your head.",
    best:"Winding down before sleep and noticing where you hold stress.",
    steps:["Lie down or sit back. Close your eyes or rest your gaze on one spot.","Bring your attention to your feet. Notice whatever is there: warmth, pressure, tingling, or nothing at all.","Move slowly upward: legs, hips, belly, chest, hands, arms, shoulders, neck, face.","When your mind wanders (it will), notice where it went and gently come back to the body.","End by sensing your whole body breathing at once."],
    why:"Paying attention without trying to change anything trains the mind to step out of worry loops, and tension often softens by itself.",
    evidence:"A core practice in mindfulness programmes, which reduce anxiety and depression by a small-to-moderate amount in meta-analyses [[Goyal et al., 2014; Khoury et al., 2015]]. On its own, though, a review of 14 trials found the body scan had only a small effect and wasn't enough by itself to improve health outcomes [[Gan et al., 2022]]. We include it as a gentle way to wind down, and mark it practice-based.",
    caution:"If focusing on your body brings up distress, open your eyes and switch to an outward focus such as grounding." },
  ar:{ name:"مسح الجسد", short:"انقل انتباهك ببطء من قدميك إلى رأسك.",
    best:"الاسترخاء قبل النوم، وملاحظة المواضع التي يتجمّع فيها توترك.",
    steps:["استلقِ أو اجلس متكئاً، وأغمض عينيك أو أرخِ نظرك على نقطة واحدة.","وجّه انتباهك إلى قدميك، ولاحظ ما تجده: دفئاً أو ضغطاً أو وخزاً، أو لا شيء على الإطلاق.","اصعد ببطء: الساقان، والوركان، والبطن، والصدر، واليدان، والذراعان، والكتفان، والرقبة، والوجه.","حين يشرد ذهنك (وسيشرد)، لاحظ أين ذهب، وعُد بلطف إلى جسدك.","اختم بالإحساس بجسدك كله يتنفّس معاً."],
    why:"الانتباه دون محاولة تغيير أي شيء يدرّب الذهن على الخروج من دوّامات القلق، وكثيراً ما يلين التوتر من تلقاء نفسه.",
    evidence:"ممارسة أساسية في برامج اليقظة الذهنية، التي تخفّف القلق والاكتئاب بقدر صغير إلى متوسط في التحليلات التجميعية [[Goyal et al., 2014; Khoury et al., 2015]]. لكن مراجعة لـ14 تجربة وجدت أن لمسح الجسد وحده أثراً صغيراً، وأنه لا يكفي بمفرده لتحسين النتائج الصحية [[Gan et al., 2022]]. أدرجناه بوصفه طريقة لطيفة للاسترخاء، ونصنّفه قائماً على الممارسة.",
    caution:"إذا أثار التركيز على جسدك ضيقاً، افتح عينيك وانتقل إلى تركيز خارجي كتمرين التأريض." } },

{ id:"grounding", cat:"mind", icon:"eye", ev:"practice", runner:"grounding", mins:[2,2], refs:[],
  en:{ name:"5-4-3-2-1 grounding", short:"Use your five senses to come back to the present.",
    best:"Spiralling thoughts, feeling flooded or detached, sudden spikes of anxiety.",
    steps:["Name 5 things you can see.","Notice 4 things you can feel: your feet on the floor, the chair, your clothes.","Listen for 3 sounds.","Find 2 things you can smell, or think of two smells you like.","Notice 1 thing you can taste."],
    why:"Shifting attention to concrete sensory detail pulls focus away from anxious predictions and back to what's actually here.",
    evidence:"A standard technique in anxiety and trauma care. We found no controlled trial of this exact exercise, so we mark it practice-based. It's included because it's simple, safe and widely recommended by clinicians.", caution:"" },
  ar:{ name:"تمرين التأريض 5-4-3-2-1", short:"استخدم حواسك الخمس لتعود إلى اللحظة الحاضرة.",
    best:"الأفكار المتصاعدة، والشعور بالغرق أو الانفصال، ونوبات القلق المفاجئة.",
    steps:["سمِّ 5 أشياء تراها.","لاحظ 4 أشياء تشعر بها: قدماك على الأرض، والكرسي، وملابسك.","أنصت إلى 3 أصوات.","اعثر على رائحتين، أو تذكّر رائحتين تحبّهما.","لاحظ شيئاً واحداً تتذوّقه."],
    why:"نقل الانتباه إلى تفاصيل حسية ملموسة يبعد تركيزك عن التوقعات المقلقة ويعيده إلى ما هو موجود فعلاً.",
    evidence:"تقنية شائعة في علاج القلق والصدمات. لم نجد تجربة مضبوطة على هذا التمرين بعينه، لذا نصنّفه قائماً على الممارسة. أدرجناه لأنه بسيط وآمن ويوصي به المختصّون على نطاق واسع.", caution:"" } },

{ id:"nameit", cat:"mind", icon:"tag", ev:"emerging", runner:"nameit", mins:[2,2], refs:["lieberman2007","torre2018"],
  en:{ name:"Name the feeling", short:"Put a precise word on what you feel.",
    best:"Strong emotions that feel like one big blur.",
    steps:["Pause and ask yourself: what am I feeling right now?","Pick the closest family of feelings, then the most precise word.","Finish the sentence: I feel ___ because ___.","Say the word to yourself once, calmly, and notice whether the intensity shifts."],
    why:"Putting feelings into words engages the brain's regulation networks and can quiet its alarm response, even though it doesn't feel like trying to calm down.",
    evidence:"In a brain-imaging study, choosing a word for an emotion dampened activity in the amygdala, the brain's alarm centre, compared with other tasks [[Lieberman et al., 2007]]. Later work describes labelling as an effortless form of emotion regulation [[Torre & Lieberman, 2018]]. Effects show up more consistently in body measures than in how upset people say they feel, so we mark it emerging.", caution:"" },
  ar:{ name:"سمِّ شعورك", short:"ضع كلمة دقيقة لما تشعر به.",
    best:"المشاعر القوية التي تبدو كتلة واحدة ضبابية.",
    steps:["توقّف واسأل نفسك: بماذا أشعر الآن؟","اختر أقرب عائلة من المشاعر، ثم الكلمة الأدق.","أكمل الجملة: أشعر بأنني ___ لأن ___.","قل الكلمة لنفسك مرة واحدة بهدوء، ولاحظ إن كانت شدّة الشعور قد تغيّرت."],
    why:"التعبير عن المشاعر بالكلمات يُشغّل شبكات التنظيم في الدماغ وقد يهدّئ استجابة الإنذار فيه، رغم أنه لا يبدو محاولةً للتهدئة.",
    evidence:"في دراسة بتصوير الدماغ، خفّف اختيارُ كلمة تصف الشعور نشاطَ اللوزة الدماغية، مركز الإنذار في الدماغ، مقارنةً بمهام أخرى [[Lieberman et al., 2007]]. وتصف أعمال لاحقة التسمية بأنها شكل من تنظيم المشاعر لا يتطلّب جهداً [[Torre & Lieberman, 2018]]. تظهر الآثار بثبات أكبر في القياسات الجسدية منها في وصف الناس لانزعاجهم، لذا نصنّف الدليل ناشئاً.", caution:"" } },

{ id:"worry", cat:"mind", icon:"park", ev:"emerging", runner:"worry", mins:[1,15], refs:["borkovec1983","mcgowan2013"],
  en:{ name:"Worry parking", short:"Write the worry down and save it for a set time.",
    best:"Worries that keep interrupting your work, study or sleep.",
    steps:["When a worry pops up, write it here in a few words. That's it: it's parked.","Turn your attention back to what you were doing.","Set one daily worry window of 15–30 minutes at the same time and place, not close to bedtime.","In the window, go through your list. For each worry, ask: can I act on this? If yes, plan one step. If not, let it go until next time."],
    why:"Postponing worry breaks the habit of worrying everywhere, all day. Many worries also look smaller when you come back to them later.",
    evidence:"Known as stimulus control for worry [[Borkovec et al., 1983]]. In a small randomized trial, a daily worry period reduced worry, anxiety and insomnia symptoms compared with a control group [[McGowan & Behar, 2013]]. Later trials have been mixed, so we mark it emerging.",
    caution:"Persistent, uncontrollable worry that disrupts daily life is worth discussing with a professional." },
  ar:{ name:"تأجيل القلق", short:"دوّن ما يقلقك واحتفظ به لوقت محدد.",
    best:"المخاوف التي تقاطع عملك أو دراستك أو نومك باستمرار.",
    steps:["حين يخطر لك قلق، اكتبه هنا في بضع كلمات. هذا كل شيء: لقد أجّلته.","أعِد انتباهك إلى ما كنت تفعله.","حدّد نافذة يومية للقلق من 15 إلى 30 دقيقة، في الوقت والمكان نفسيهما، وبعيداً عن موعد النوم.","في النافذة، راجع قائمتك واسأل عن كل قلق: هل أستطيع التصرّف فيه؟ إن كان الجواب نعم فخطّط لخطوة واحدة، وإن كان لا فدَعه حتى المرة القادمة."],
    why:"تأجيل القلق يكسر عادة القلق في كل مكان وطوال اليوم. كما تبدو كثير من المخاوف أصغر حين تعود إليها لاحقاً.",
    evidence:"تُعرف هذه التقنية بضبط المثيرات للقلق [[Borkovec et al., 1983]]. في تجربة عشوائية صغيرة، خفّضت فترةُ القلق اليومية الانشغالَ بالهموم والقلقَ وأعراضَ الأرق مقارنةً بمجموعة ضابطة [[McGowan & Behar, 2013]]. وجاءت نتائج التجارب اللاحقة متباينة، لذا نصنّف الدليل ناشئاً.",
    caution:"القلق المستمر الذي يصعب التحكّم فيه ويعطّل حياتك اليومية يستحق أن تناقشه مع مختص." } },

{ id:"thought", cat:"mind", icon:"scale", ev:"moderate", runner:"thought", mins:[5,10], refs:["webb2012","kross2014"],
  en:{ name:"Thought check", short:"Question a stressful thought and find a more balanced one.",
    best:"Catastrophising, harsh self-talk, assuming the worst.",
    steps:["Write down the situation and the thought that's bothering you.","Check it for common thinking traps.","List the evidence for and against the thought.","Ask what you'd tell a friend in your place, then say it to yourself using your own name.","Write a more balanced thought and notice how you feel now."],
    why:"How you interpret a situation shapes the emotion that follows. Distanced self-talk (“Sara, what do you need right now?”) makes it easier to think clearly under stress.",
    evidence:"Rethinking a situation is a core skill of cognitive behavioural therapy. Across 306 experiments, reappraising a situation changed emotions with a small-to-medium effect, while trying to suppress feelings or thoughts did not help [[Webb et al., 2012]]. Referring to yourself by name or as “you” reduced distress during stressful tasks [[Kross et al., 2014]].",
    caution:"If your thoughts turn to harming yourself, stop and go to Get help." },
  ar:{ name:"فحص الأفكار", short:"سائل فكرة مُجهِدة وابحث عن فكرة أكثر توازناً.",
    best:"التهويل، والحديث القاسي مع النفس، وتوقّع الأسوأ.",
    steps:["دوّن الموقف والفكرة التي تزعجك.","افحصها بحثاً عن فخاخ التفكير الشائعة.","اكتب الأدلة التي تؤيّد الفكرة وتلك التي تعارضها.","اسأل نفسك ماذا كنت ستقول لصديق في مكانك، ثم قله لنفسك مستخدماً اسمك.","اكتب فكرة أكثر توازناً، ولاحظ كيف تشعر الآن."],
    why:"طريقة تفسيرك للموقف تحدّد الشعور الذي يليه. والحديث مع النفس من مسافة («سارة، ما الذي تحتاجينه الآن؟») يسهّل التفكير بوضوح تحت الضغط.",
    evidence:"إعادة التفكير في الموقف مهارة أساسية في العلاج المعرفي السلوكي. عبر 306 تجارب، غيّرت إعادة تقييم الموقف المشاعرَ بأثر صغير إلى متوسط، في حين لم تُجدِ محاولة كبت المشاعر أو الأفكار [[Webb et al., 2012]]. كما خفّف الحديثُ مع النفس بالاسم أو بضمير المخاطَب الضيقَ أثناء المهام المُجهِدة [[Kross et al., 2014]].",
    caution:"إذا اتّجهت أفكارك إلى إيذاء نفسك، توقّف وانتقل إلى «طلب المساعدة»." } },

{ id:"reframe", cat:"mind", icon:"bolt", ev:"moderate", runner:"cards", mins:[1,2], refs:["jamieson2012","brooks2014","liu2019"],
  en:{ name:"Reframe the rush", short:"Turn pre-performance nerves into fuel.",
    best:"Right before an exam, presentation, interview or difficult meeting.",
    steps:["Notice the signs: a fast heart, butterflies, a warm face.","Remind yourself that this is your body getting ready, sending more oxygen to your brain and muscles.","Say it out loud or in your head: “I'm excited.” Don't try to force yourself to be calm.","Take a minute of slow breathing, then go."],
    why:"Going from high arousal to calm is hard. Relabelling the same arousal as readiness or excitement is easier, and keeps your attention on the opportunity rather than the threat.",
    evidence:"People taught that stress arousal helps them showed a healthier cardiovascular response and paid less attention to threat during a stressful test [[Jamieson et al., 2012]]. Saying “I'm excited” before singing, public speaking or a maths test improved performance compared with saying “I'm calm” [[Brooks, 2014]]. A meta-analysis found that reappraising stress reduced how stressed people felt, though not their physiological stress markers [[Liu et al., 2019]].", caution:"" },
  ar:{ name:"حوّل التوتر إلى طاقة", short:"اجعل ارتباك ما قبل الأداء وقوداً لك.",
    best:"قُبيل امتحان أو عرض تقديمي أو مقابلة أو اجتماع صعب.",
    steps:["لاحظ العلامات: قلب سريع، رفرفة في المعدة، حرارة في الوجه.","ذكّر نفسك بأن هذا جسدك يستعدّ، ويرسل مزيداً من الأكسجين إلى دماغك وعضلاتك.","قلها بصوت مسموع أو في سرّك: «أنا متحمّس». لا تحاول أن تُجبر نفسك على الهدوء.","خذ دقيقة من التنفّس البطيء، ثم انطلق."],
    why:"الانتقال من الاستثارة العالية إلى الهدوء صعب. أما إعادة تسمية الاستثارة نفسها استعداداً أو حماساً فأسهل، وتُبقي انتباهك على الفرصة لا على التهديد.",
    evidence:"أظهر من تعلّموا أن استثارة التوتر تساعدهم استجابةً قلبية وعائية أصحّ وانتباهاً أقل للتهديد أثناء اختبار مُجهِد [[Jamieson et al., 2012]]. وأدّى قول «أنا متحمّس» قبل الغناء أو الخطابة أو اختبار رياضيات إلى أداء أفضل من قول «أنا هادئ» [[Brooks, 2014]]. ووجد تحليل تجميعي أن إعادة تقييم التوتر خفّفت شعور الناس بالتوتر، وإن لم تغيّر مؤشراته الفسيولوجية [[Liu et al., 2019]].", caution:"" } },

{ id:"writing", cat:"mind", icon:"pen", ev:"moderate", runner:"writing", mins:[10,20], refs:["frattaroli2006","pennebaker1986","ramirez2011"],
  en:{ name:"Expressive writing", short:"Write freely about what's weighing on you.",
    best:"Stress that keeps circling, things you can't say out loud, worry before a test.",
    steps:["Set the timer for 15–20 minutes (10 is fine before an exam).","Write your deepest thoughts and feelings about what's stressing you. Don't worry about grammar or spelling.","Keep writing until the timer ends. If you run out of words, repeat what you've already written.","When you finish, keep it in your private journal or shred it. Both are fine.","The classic method uses 3–4 sessions on separate days."],
    why:"Turning a jumble of feelings into words helps you make sense of them, and frees up the mental effort spent holding them in.",
    evidence:"In the original study, students wrote for 15 minutes on four consecutive days and later made fewer visits to the health centre [[Pennebaker & Beall, 1986]]. Across 146 studies the average benefit is small but reliable [[Frattaroli, 2006]]. An early classroom study found that 10 minutes of writing about test worries raised anxious students' scores [[Ramirez & Beilock, 2011]], but later replications have been mixed.",
    caution:"It's normal to feel a little low right after writing. If it becomes overwhelming, stop and switch to breathing or grounding." },
  ar:{ name:"الكتابة التعبيرية", short:"اكتب بحرية عمّا يُثقل عليك.",
    best:"التوتر الذي يدور في رأسك، والأمور التي لا تستطيع قولها بصوت مسموع، والقلق قبل الاختبار.",
    steps:["اضبط المؤقّت على 15 إلى 20 دقيقة (10 دقائق تكفي قبل الامتحان).","اكتب أعمق أفكارك ومشاعرك تجاه ما يوتّرك، ولا تقلق بشأن القواعد أو الإملاء.","واصل الكتابة حتى ينتهي المؤقّت. وإن نفدت كلماتك، فكرّر ما كتبته.","حين تنتهي، احتفظ به في مذكّراتك الخاصة أو مزّقه؛ كلاهما مناسب.","تعتمد الطريقة الأصلية على 3 إلى 4 جلسات في أيام مختلفة."],
    why:"تحويل خليط المشاعر إلى كلمات يساعدك على فهمها، ويحرّر الجهد الذهني الذي تبذله في كتمانها.",
    evidence:"في الدراسة الأصلية، كتب طلاب لمدة 15 دقيقة في أربعة أيام متتالية، فقلّت زياراتهم لاحقاً للمركز الصحي [[Pennebaker & Beall, 1986]]. وعبر 146 دراسة، كان متوسط الفائدة صغيراً لكنه ثابت [[Frattaroli, 2006]]. ووجدت دراسة صفّية مبكرة أن 10 دقائق من الكتابة عن مخاوف الاختبار رفعت درجات الطلاب القلقين [[Ramirez & Beilock, 2011]]، لكن محاولات التكرار اللاحقة جاءت متباينة.",
    caution:"من الطبيعي أن تشعر ببعض الحزن بعد الكتابة مباشرة. وإن أصبح الأمر مُرهِقاً، توقّف وانتقل إلى التنفّس أو التأريض." } },

{ id:"selfcomp", cat:"mind", icon:"heart", ev:"moderate", runner:"cards", mins:[2,3], refs:["ferrari2019","neff2013"],
  en:{ name:"Self-compassion break", short:"Treat yourself the way you'd treat a good friend.",
    best:"Self-criticism, feeling like you've failed, shame after a mistake.",
    steps:["Acknowledge the moment: “This is really hard right now.”","Remember you're not alone: “Other people feel this too. It's part of being human.”","If it feels right, place a hand on your chest or another comforting spot.","Offer yourself kindness: “What do I need right now? May I be patient with myself.”"],
    why:"Self-criticism triggers the body's threat response. Meeting yourself with warmth engages the calming, caregiving system instead, and makes it easier to learn from setbacks.",
    evidence:"A meta-analysis of 27 randomized trials found that self-compassion training reduced stress, anxiety, depression, rumination and self-criticism [[Ferrari et al., 2019]]. The best-known programme is an 8-week course [[Neff & Germer, 2013]]; this brief exercise draws on the same skills.",
    caution:"Self-kindness can feel awkward at first. That's common and usually eases with practice." },
  ar:{ name:"استراحة التعاطف مع الذات", short:"عامل نفسك كما تعامل صديقاً عزيزاً.",
    best:"انتقاد الذات، والشعور بالفشل، والخجل بعد خطأ.",
    steps:["اعترف باللحظة: «هذا صعب جداً الآن».","تذكّر أنك لست وحدك: «الآخرون يشعرون بهذا أيضاً، وهو جزء من كوننا بشراً».","إن شعرت بأن ذلك مناسب، ضع يدك على صدرك أو على موضع يريحك.","امنح نفسك اللطف: «ما الذي أحتاجه الآن؟ لأصبر على نفسي»."],
    why:"انتقاد الذات يُطلق استجابة التهديد في الجسد. أما مقابلة نفسك بالدفء فتُشغّل جهاز التهدئة والرعاية بدلاً منها، وتسهّل التعلّم من العثرات.",
    evidence:"وجد تحليل تجميعي لـ27 تجربة عشوائية أن التدريب على التعاطف مع الذات خفّض التوتر والقلق والاكتئاب واجترار الأفكار وانتقاد الذات [[Ferrari et al., 2019]]. وأشهر برامجه دورة مدتها 8 أسابيع [[Neff & Germer, 2013]]، وهذا التمرين القصير يستند إلى المهارات نفسها.",
    caution:"قد يبدو اللطف مع النفس غريباً في البداية. هذا شائع، وعادةً ما يخفّ مع الممارسة." } },

{ id:"control", cat:"mind", icon:"tools", ev:"moderate", runner:"control", mins:[5,10], refs:["malouff2007","gollwitzer2006"],
  en:{ name:"Control sorter", short:"Sort your stressors by what you can change, then plan one step.",
    best:"Feeling overwhelmed by a long list of problems.",
    steps:["List what's stressing you.","Sort each item: I can act on it, I can influence it, or it's outside my control.","For the ones you can act on, write the smallest next step.","Turn it into an if-then plan: “If it's 9 a.m. tomorrow, then I'll email my supervisor.”","For what you can't control, choose a way to cope: slow your breathing, talk to someone, or accept it for now and refocus."],
    why:"Stress drops when you separate solvable problems from unsolvable ones. If-then plans make it far more likely that you'll actually start.",
    evidence:"Structured problem-solving therapy reduces mental and physical health problems, with a medium effect compared with usual care [[Malouff et al., 2007]]. If-then plans had a medium-to-large effect on reaching goals across 94 studies [[Gollwitzer & Sheeran, 2006]]. This tool combines both methods; the combination itself hasn't been tested as a single exercise.", caution:"" },
  ar:{ name:"فرز ما تتحكّم فيه", short:"صنّف مصادر توترك حسب قدرتك على تغييرها، ثم خطّط لخطوة واحدة.",
    best:"الشعور بالإرهاق أمام قائمة طويلة من المشكلات.",
    steps:["اكتب ما يوتّرك.","صنّف كل بند: أستطيع التصرّف فيه، أو أستطيع التأثير فيه، أو هو خارج سيطرتي.","لما تستطيع التصرّف فيه، اكتب أصغر خطوة تالية.","حوّلها إلى خطة «إذا… فسأ…»: «إذا حلّت التاسعة صباح الغد، فسأراسل مشرفي».","ولما لا تستطيع التحكّم فيه، اختر طريقة للتأقلم: أبطئ تنفّسك، أو تحدّث إلى أحد، أو تقبّله الآن وأعِد تركيزك."],
    why:"ينخفض التوتر حين تفصل المشكلات القابلة للحل عن غيرها. وخطط «إذا… فسأ…» تزيد كثيراً من احتمال أن تبدأ فعلاً.",
    evidence:"العلاج بحلّ المشكلات المنظّم يخفّف المشكلات النفسية والجسدية، بأثر متوسط مقارنةً بالرعاية المعتادة [[Malouff et al., 2007]]. وكان لخطط «إذا… فسأ…» أثر متوسط إلى كبير في بلوغ الأهداف عبر 94 دراسة [[Gollwitzer & Sheeran, 2006]]. تجمع هذه الأداة بين الطريقتين، ولم يُختبر هذا الجمع بوصفه تمريناً واحداً.", caution:"" } },

{ id:"microbreak", cat:"restore", icon:"clock", ev:"moderate", runner:"steps", mins:[3,3], refs:["albulescu2022"],
  en:{ name:"Micro-break", short:"Three minutes away from the screen.",
    best:"Long stretches at the screen, mental fatigue, feeling drained.",
    steps:["Stand up and shake out your hands and shoulders.","Rest your eyes on something far away.","Stretch gently: reach up, then lean side to side.","Walk a few steps or get a glass of water.","Come back with three slow breaths."],
    why:"Short breaks restore energy before fatigue builds up. They work best when you take them regularly, not only once you're exhausted.",
    evidence:"A meta-analysis of 22 samples found that breaks of 10 minutes or less increased vigour and reduced fatigue, both by a small amount. Effects on work performance were less clear and depended on the task [[Albulescu et al., 2022]].", caution:"" },
  ar:{ name:"استراحة قصيرة", short:"ثلاث دقائق بعيداً عن الشاشة.",
    best:"الجلوس الطويل أمام الشاشة، والتعب الذهني، والشعور بالإنهاك.",
    steps:["قِف وانفض يديك وكتفيك.","أرِح عينيك بالنظر إلى شيء بعيد.","تمدّد بلطف: ارفع ذراعيك ثم مِل إلى الجانبين.","امشِ بضع خطوات أو اشرب كوب ماء.","عُد بثلاثة أنفاس بطيئة."],
    why:"الاستراحات القصيرة تستعيد طاقتك قبل أن يتراكم التعب، وتنجح أكثر حين تأخذها بانتظام، لا حين تكون مستنزَفاً فقط.",
    evidence:"وجد تحليل تجميعي لـ22 عيّنة أن الاستراحات التي لا تتجاوز 10 دقائق رفعت النشاط وخفّفت التعب، وكلاهما بقدر صغير. أما أثرها في أداء العمل فكان أقل وضوحاً واعتمد على نوع المهمة [[Albulescu et al., 2022]].", caution:"" } },

{ id:"movement", cat:"restore", icon:"pulse", ev:"strong", runner:"steps", mins:[5,5], refs:["singh2023","who2020"],
  en:{ name:"Movement burst", short:"Five minutes of brisk movement, no equipment needed.",
    best:"Restless energy, low mood, long periods of sitting.",
    steps:["March in place, swinging your arms.","Do slow sit-to-stands from your chair.","Rise up onto your toes and lower down.","Do push-ups against a wall or a sturdy desk.","Finish with a brisk march and three slow breaths. Or swap the routine for a 10-minute brisk walk."],
    why:"Movement uses up the energy the stress response mobilises, and regular activity makes the stress system less reactive over time.",
    evidence:"An overview of 97 reviews, covering more than 1,000 trials and 128,000 people, found that physical activity reduced symptoms of depression, anxiety and distress by a medium amount [[Singh et al., 2023]]. The WHO recommends 150–300 minutes of moderate activity a week [[WHO, 2020]]. For anger specifically, calming activities work better than vigorous exercise.",
    caution:"Stop if you feel pain, chest discomfort or dizziness. Check with a doctor first if you have a heart condition or haven't been active for a while." },
  ar:{ name:"دفعة حركة", short:"خمس دقائق من الحركة النشطة، دون أي أدوات.",
    best:"الطاقة المضطربة، والمزاج المنخفض، والجلوس لفترات طويلة.",
    steps:["امشِ في مكانك مع أرجحة ذراعيك.","انهض من كرسيك واجلس ببطء عدة مرات.","ارتفع على أطراف أصابعك ثم انزل.","اضغط على جدار أو مكتب ثابت.","اختم بمشي سريع في المكان وثلاثة أنفاس بطيئة، أو استبدل بالتمرين مشياً سريعاً لمدة 10 دقائق."],
    why:"الحركة تستهلك الطاقة التي تحشدها استجابة التوتر، والنشاط المنتظم يجعل جهاز التوتر أقل تفاعلاً مع الوقت.",
    evidence:"وجدت مراجعة شاملة لـ97 مراجعة علمية، تغطي أكثر من 1000 تجربة و128 ألف شخص، أن النشاط البدني خفّض أعراض الاكتئاب والقلق والضيق النفسي بقدر متوسط [[Singh et al., 2023]]. وتوصي منظمة الصحة العالمية بـ150 إلى 300 دقيقة من النشاط المعتدل أسبوعياً [[WHO, 2020]]. أما للغضب تحديداً، فالأنشطة المهدّئة أنجع من التمارين العنيفة.",
    caution:"توقّف إذا شعرت بألم أو انزعاج في الصدر أو دوار. واستشر طبيبك أولاً إذا كنت تعاني من مرض في القلب أو لم تمارس النشاط منذ مدة." } },

{ id:"nature", cat:"restore", icon:"leaf", ev:"moderate", runner:"nature", mins:[5,30], refs:["hunter2019","buxton2021","alvarsson2010","dewitte2020"],
  en:{ name:"Nature break", short:"Step outside, or listen to nature-like sound.",
    best:"Mental fatigue, tension, feeling cooped up.",
    steps:["Best option: go to a park or any green space for 20–30 minutes. Sit or stroll, and keep your phone in your pocket.","Can't go out? Look out of a window at trees or the sky.","Or play one of the sounds here, close your eyes and listen for 5–10 minutes.","Prefer music? Calming music you choose yourself also lowers stress."],
    why:"Natural settings hold your attention gently, letting effortful focus rest. They're also linked to lower levels of stress hormones.",
    evidence:"In a study of 36 city dwellers, nature visits lowered the stress hormone cortisol, with the most benefit per minute at 20–30 minutes [[Hunter et al., 2019]]. A synthesis of 36 studies linked natural sounds to lower stress and annoyance [[Buxton et al., 2021]], and across 104 trials music reduced both felt and physical stress [[de Witte et al., 2020]]. Unknot's sounds are generated by the app to resemble rain, waves and wind; the studies used recordings of real natural sounds.", caution:"" },
  ar:{ name:"استراحة في الطبيعة", short:"اخرج إلى الطبيعة، أو استمع إلى أصوات تشبهها.",
    best:"التعب الذهني، والتوتر، والشعور بالانحباس.",
    steps:["الخيار الأفضل: اذهب إلى حديقة أو أي مساحة خضراء لمدة 20 إلى 30 دقيقة. اجلس أو تمشَّ على مهل، وأبقِ هاتفك في جيبك.","لا تستطيع الخروج؟ انظر من النافذة إلى الأشجار أو السماء.","أو شغّل أحد الأصوات هنا، وأغمض عينيك واستمع لمدة 5 إلى 10 دقائق.","تفضّل الموسيقى؟ الموسيقى الهادئة التي تختارها بنفسك تخفّف التوتر أيضاً."],
    why:"البيئات الطبيعية تجذب انتباهك بلطف، فيرتاح تركيزك المُجهَد. كما ترتبط بانخفاض مستويات هرمونات التوتر.",
    evidence:"في دراسة على 36 من سكان المدن، خفّضت زيارات الطبيعة هرمون التوتر (الكورتيزول)، وكانت أكبر فائدة لكل دقيقة عند 20 إلى 30 دقيقة [[Hunter et al., 2019]]. وربطت مراجعة لـ36 دراسة الأصوات الطبيعية بتوتر وانزعاج أقل [[Buxton et al., 2021]]، وعبر 104 تجارب خفّضت الموسيقى التوتر المحسوس والجسدي معاً [[de Witte et al., 2020]]. أصوات Unknot يولّدها التطبيق لتشبه المطر والأمواج والرياح، بينما استخدمت الدراسات تسجيلات لأصوات طبيعية حقيقية.", caution:"" } },

{ id:"reachout", cat:"restore", icon:"chat", ev:"moderate", runner:"chat", mins:[2,2], refs:["cohen1985","holtlunstad2010"],
  en:{ name:"Reach out", short:"Send one message to someone you trust.",
    best:"Feeling alone with a problem, low mood, the end of a hard day.",
    steps:["Think of one person who usually leaves you feeling better.","Pick or edit a message below, then copy it.","Send it. It doesn't have to be about the problem; the contact itself helps."],
    why:"Support from others dampens the body's stress response and makes problems feel more manageable.",
    evidence:"A classic review concluded that social support buffers people against the effects of stress [[Cohen & Wills, 1985]]. Across 148 long-term studies, people with stronger social relationships had about 50% higher odds of survival [[Holt-Lunstad et al., 2010]].",
    caution:"If you're in crisis, contact emergency services or a helpline. See Get help." },
  ar:{ name:"تواصل مع أحد", short:"أرسل رسالة واحدة إلى شخص تثق به.",
    best:"الشعور بالوحدة أمام مشكلة، والمزاج المنخفض، ونهاية يوم صعب.",
    steps:["فكّر في شخص واحد تشعر بتحسّن عادةً بعد الحديث معه.","اختر رسالة من الأسفل أو عدّلها، ثم انسخها.","أرسلها. لا يلزم أن تكون عن المشكلة؛ فالتواصل بحد ذاته يساعد."],
    why:"الدعم من الآخرين يخفّف استجابة الجسد للتوتر، ويجعل المشكلات تبدو أسهل احتمالاً.",
    evidence:"خلصت مراجعة كلاسيكية إلى أن الدعم الاجتماعي يحمي الناس من آثار التوتر [[Cohen & Wills, 1985]]. وعبر 148 دراسة طويلة المدى، كانت احتمالات البقاء على قيد الحياة أعلى بنحو 50% لدى من لديهم علاقات اجتماعية أقوى [[Holt-Lunstad et al., 2010]].",

const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function defaults(){
  const nav = (navigator.language || "en").toLowerCase();
  return {
    v: 1,
    settings: { lang: nav.startsWith("ar") ? "ar" : "en", theme: "system", sound: true, vol: 0.55, ratings: true,
      motion: "graph", breakEvery: 0, worryTime: "18:00", worryLen: 15, name: "", welcomed: false, worryDone: "" },

    pins: []
  };
}
let S = loadState();
let DEMO = null; // in-memory example data for Insights; never saved
function loadState(){
  const d = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === "object") {
        for (const k of Object.keys(d)) if (Array.isArray(d[k]) && Array.isArray(o[k])) d[k] = o[k];
        if (o.settings && typeof o.settings === "object") Object.assign(d.settings, o.settings);
      }
    }
  } catch (e) {}
  return d;
}
let saveTimer = 0;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120);
}
function saveNow(){ clearTimeout(saveTimer); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- language ----------
const lang = () => S.settings.lang === "ar" ? "ar" : "en";
function t(key, vars){
  let s = (STR[lang()] && STR[lang()][key]) || STR.en[key] || key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m);
  return s;
}
const L = o => (o && (o[lang()] || o.en)) || {};
let pluralRules = {};
function pl(key, n){
  const lg = lang(), forms = PLURAL[key][lg] || PLURAL[key].en;
  try { pluralRules[lg] = pluralRules[lg] || new Intl.PluralRules(lg); } catch (e) {}
  let cat = pluralRules[lg] ? pluralRules[lg].select(n) : (n === 1 ? "one" : "other");
  if (!forms[cat]) cat = "other";
  return forms[cat].replace("{n}", fmtNum(n));
}
function fmtNum(n, d){ return (d != null ? Number(n).toFixed(d) : String(n)); }
function locale(){ return lang() === "ar" ? "ar-u-nu-latn" : "en-GB"; }
function fmtDate(ts, opts){ try { return new Intl.DateTimeFormat(locale(), opts || {weekday:"long", day:"numeric", month:"long"}).format(new Date(ts)); } catch (e) { return new Date(ts).toDateString(); } }
function fmtTime(ts){ try { return new Intl.DateTimeFormat(locale(), {hour:"2-digit", minute:"2-digit"}).format(new Date(ts)); } catch (e) { return ""; } }
function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function whenText(ts){
  const d = new Date(ts), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if (diff === 0) return t("gen.today") + " " + fmtTime(ts);
  if (diff === 1) return t("gen.yesterday") + " " + fmtTime(ts);
  return fmtDate(ts, {day:"numeric", month:"short"}) + " " + fmtTime(ts);
}
function dayKey(ts){ const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function startOfDay(ts){ const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function timeLabel(hhmm){ const [h, m] = (hhmm || "18:00").split(":").map(Number); const d = new Date(); d.setHours(h || 0, m || 0, 0, 0); return fmtTime(d.getTime()); }

// level colour 0-10 (calm -> mid -> high), resolved from theme tokens
function lvColor(v){
  if (v == null) return "var(--line-2)";
  if (v <= 5) return `color-mix(in oklab, var(--mid) ${Math.round(v / 5 * 100)}%, var(--calm))`;
  return `color-mix(in oklab, var(--high) ${Math.round((v - 5) / 5 * 100)}%, var(--mid))`;
}
