// ---------- sound: chimes and generated nature beds (Web Audio, no files) ----------
const Snd = {
  ctx: null, master: null, nat: null, noiseBuf: null,
  ok(){ return !!(window.AudioContext || window.webkitAudioContext); },
  ensure(){
    if (!this.ok()) return null;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = S.settings.vol;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) { return null; }
    return this.ctx;
  },
  setVol(v){ if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); },
  // soft bell: fundamental plus quiet inharmonic partials, slow decay
  bell(freq, when, gain, len){
    const c = this.ensure(); if (!c) return;
    const t0 = Math.max(c.currentTime, when || c.currentTime);
    const out = c.createGain(); out.connect(this.master);
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.exponentialRampToValueAtTime(gain || 0.18, t0 + 0.015);
    out.gain.exponentialRampToValueAtTime(0.0001, t0 + (len || 2.2));
    [[1, 1], [2.01, 0.28], [2.76, 0.12], [5.4, 0.04]].forEach(([m, g]) => {
      const o = c.createOscillator(), og = c.createGain();
      o.type = "sine"; o.frequency.value = freq * m; og.gain.value = g;
      o.connect(og); og.connect(out); o.start(t0); o.stop(t0 + (len || 2.2) + 0.05);
    });
  },
  cue(kind, when){
    if (!S.settings.sound) return;
    const f = {in:392, top:493.88, out:293.66, hold:349.23, tense:440, release:261.63, step:329.63, end:523.25, start:392}[kind] || 330;
    this.bell(f, when, kind === "top" ? 0.11 : 0.16, kind === "out" ? 3 : 2.2);
    if (kind === "end") { this.bell(659.25, (when || this.ctx.currentTime) + 0.18, 0.12, 2.6); this.bell(783.99, (when || this.ctx.currentTime) + 0.36, 0.1, 3); }
  },
  noise(){
    if (this.noiseBuf) return this.noiseBuf;
    const c = this.ctx, len = c.sampleRate * 3, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return (this.noiseBuf = b);
  },
  src(){ const s = this.ctx.createBufferSource(); s.buffer = this.noise(); s.loop = true; s.loopStart = Math.random(); return s; },
  lfo(rate, depth, target, base){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.value = rate; g.gain.value = depth; o.connect(g); g.connect(target);
    if (base != null) target.value = base;
    o.start(); return o;
  },
  startNature(type){
    const c = this.ensure(); if (!c) return false;
    this.stopNature(true);
    const bus = c.createGain(); bus.gain.setValueAtTime(0.0001, c.currentTime); bus.gain.exponentialRampToValueAtTime(1, c.currentTime + 2);
    bus.connect(this.master);
    const nodes = [], timers = [];
    const add = (...n) => n.forEach(x => nodes.push(x));
    if (type === "waves") {
      [[0.083, 0.0], [0.121, 1.7]].forEach(([rate, phase], i) => {
        const s = this.src(), f = c.createBiquadFilter(), g = c.createGain();
        f.type = "lowpass"; f.Q.value = 0.6; g.gain.value = 0;
        s.connect(f); f.connect(g); g.connect(bus);
        add(s, this.lfo(rate, 520, f.frequency, 620 + i * 120), this.lfo(rate, 0.32, g.gain, 0.36));
        s.start(c.currentTime + phase);
      });
    } else if (type === "rain") {
      const s = this.src(), hp = c.createBiquadFilter(), lp = c.createBiquadFilter(), g = c.createGain();
      hp.type = "highpass"; hp.frequency.value = 900; lp.type = "lowpass"; lp.frequency.value = 7500; g.gain.value = 0.32;
      s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(bus); s.start(); add(s);
      const s2 = this.src(), lp2 = c.createBiquadFilter(), g2 = c.createGain();
      lp2.type = "lowpass"; lp2.frequency.value = 420; g2.gain.value = 0.5;
      s2.connect(lp2); lp2.connect(g2); g2.connect(bus); s2.start(); add(s2);
      const drop = () => {
        const now = c.currentTime;
        for (let i = 0; i < 6; i++) {
          const t0 = now + Math.random() * 0.25, d = c.createBufferSource(), bp = c.createBiquadFilter(), dg = c.createGain();
          d.buffer = this.noise(); bp.type = "bandpass"; bp.frequency.value = 1800 + Math.random() * 4200; bp.Q.value = 6 + Math.random() * 8;
          dg.gain.setValueAtTime(0.0001, t0); dg.gain.exponentialRampToValueAtTime(0.08 + Math.random() * 0.22, t0 + 0.004); dg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05 + Math.random() * 0.06);
          d.connect(bp); bp.connect(dg); dg.connect(bus); d.start(t0, Math.random() * 2, 0.15);
        }
      };
      timers.push(setInterval(drop, 250));
    } else if (type === "wind") {
      const s = this.src(), bp = c.createBiquadFilter(), g = c.createGain();
      bp.type = "bandpass"; bp.Q.value = 1.1; bp.frequency.value = 450; g.gain.value = 0.5;
      s.connect(bp); bp.connect(g); g.connect(bus); s.start(); add(s);
      let f = 450, a = 0.5;
      timers.push(setInterval(() => {
        f = clamp(f + (Math.random() - 0.5) * 140, 220, 950); a = clamp(a + (Math.random() - 0.5) * 0.18, 0.18, 0.75);
        bp.frequency.setTargetAtTime(f, c.currentTime, 0.6); g.gain.setTargetAtTime(a, c.currentTime, 0.8);
      }, 400));
    } else {
      const s = this.src(), lp = c.createBiquadFilter(), lp2 = c.createBiquadFilter(), hp = c.createBiquadFilter(), g = c.createGain();
      lp.type = "lowpass"; lp.frequency.value = 380; lp2.type = "lowpass"; lp2.frequency.value = 380; hp.type = "highpass"; hp.frequency.value = 35; g.gain.value = 1.6;
      s.connect(lp); lp.connect(lp2); lp2.connect(hp); hp.connect(g); g.connect(bus); s.start(); add(s);
    }
    this.nat = { bus, nodes, timers };
    return true;
  },
  stopNature(fast){
    const n = this.nat; if (!n || !this.ctx) return;
    this.nat = null;
    const c = this.ctx, end = c.currentTime + (fast ? 0.15 : 1.2);
    n.timers.forEach(clearInterval);
    try { n.bus.gain.cancelScheduledValues(c.currentTime); n.bus.gain.setValueAtTime(Math.max(n.bus.gain.value, 0.0001), c.currentTime); n.bus.gain.exponentialRampToValueAtTime(0.0001, end); } catch (e) {}
    setTimeout(() => { n.nodes.forEach(x => { try { x.stop(); } catch (e) {} }); try { n.bus.disconnect(); } catch (e) {} }, (fast ? 0.2 : 1.3) * 1000);
  }
};

// keep the screen on during sessions where supported
const Wake = {
  lock: null,
  async on(){ try { if ("wakeLock" in navigator && !this.lock) { this.lock = await navigator.wakeLock.request("screen"); this.lock.addEventListener("release", () => { this.lock = null; }); } } catch (e) { this.lock = null; } },
  off(){ try { if (this.lock) this.lock.release(); } catch (e) {} this.lock = null; }
};

function announce(msg){ const el = $("#live"); if (el) { el.textContent = ""; setTimeout(() => { el.textContent = msg; }, 30); } }
let toastTimer = 0;
function toast(msg){
  const el = $("#toast"); if (!el) return;
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
async function copyText(text, el){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    if (el) { try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e2) {} }
    return false;
  }
}
function download(name, text, type){
  try {
    const blob = new Blob([text], {type: type || "text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}

  const m = {};
  for (const s of (src || data()).sessions) {
    const o = m[s.tool] || (m[s.tool] = {n: 0, rated: 0, b: 0, a: 0, secs: 0});
    o.n++; o.secs += s.secs || 0;
    if (s.before != null && s.after != null) { o.rated++; o.b += s.before; o.a += s.after; }
  }
  for (const k in m) { const o = m[k]; if (o.rated) { o.avgB = o.b / o.rated; o.avgA = o.a / o.rated; o.drop = o.avgB - o.avgA; } }
  return m;
}
function inRange(arr, days){ const from = startOfDay(Date.now()) - (days - 1) * 864e5; return arr.filter(x => x.t >= from); }
function readings(src, days){
  const d = src || data();
  const r = inRange(d.checkins, days).map(c => ({t: c.t, v: c.level}));
  inRange(d.sessions, days).forEach(s => { if (s.before != null) r.push({t: s.t, v: s.before}); });
  return r.sort((a, b) => a.t - b.t);
}
function recsFor(stateId){
  const st = STATES.find(s => s.id === stateId); if (!st) return [];
  const ts = toolStats(S);
  return st.tools.map((id, i) => ({id, score: i - ((ts[id] && ts[id].rated >= 2) ? ts[id].drop * 0.6 : 0)}))
    .sort((a, b) => a.score - b.score).map(x => tool(x.id)).filter(Boolean);
}
function bestTool(src){
  const ts = toolStats(src); let best = null;
  for (const k in ts) if (ts[k].rated >= 2 && ts[k].drop > 0.4 && (!best || ts[k].drop > ts[best].drop)) best = k;
  return best;
}

// ---------- charts ----------
function trendSVG(days, width){
  const r = readings(null, days), W = Math.max(280, width), H = 220, padL = 28, padR = 12, padT = 14, padB = 28;
  const start = startOfDay(Date.now()) - (days - 1) * 864e5;
  const byDay = {};
  r.forEach(x => { const k = Math.floor((startOfDay(x.t) - start) / 864e5); (byDay[k] = byDay[k] || []).push(x.v); });
  const pts = Object.keys(byDay).map(k => ({i: +k, v: byDay[k].reduce((a, b) => a + b, 0) / byDay[k].length})).sort((a, b) => a.i - b.i);
  const x = i => padL + (days === 1 ? 0 : i / (days - 1)) * (W - padL - padR);
  const y = v => padT + (1 - v / 10) * (H - padT - padB);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t("in.trend"))}">`;
  s += `<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  [0, 5, 10].forEach(v => { s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v === 0 ? "0" : "3 4"}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  const labels = [0, Math.floor((days - 1) / 2), days - 1];
  labels.forEach((i, k) => { const ts = start + i * 864e5; s += `<text x="${x(i)}" y="${H - 8}" text-anchor="${k === 0 ? "start" : k === 2 ? "end" : "middle"}">${esc(fmtDate(ts, {day:"numeric", month:"short"}))}</text>`; });
  if (pts.length) {
    const line = pts.map((p, k) => (k ? "L" : "M") + x(p.i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
    if (pts.length > 1) s += `<path d="${line} L${x(pts[pts.length - 1].i).toFixed(1)} ${y(0)} L${x(pts[0].i).toFixed(1)} ${y(0)} Z" fill="url(#tg)"/>`;
    s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, k) => {
      const last = k === pts.length - 1;
      s += `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 4.5 : 2.8}" fill="${last ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="1.6"><title>${esc(fmtDate(start + p.i * 864e5, {day:"numeric", month:"short"}))}: ${p.v.toFixed(1)}</title></circle>`;
    });
    const lp = pts[pts.length - 1];
    s += `<text x="${Math.min(x(lp.i) + 0, W - padR)}" y="${y(lp.v) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:600">${lp.v.toFixed(1)}</text>`;
  }
  return s + "</svg>";
}
function barsHTML(items, max, fmt){
  if (!items.length) return "";
  return `<div class="bars">${items.map(it => `<div class="bar-row"><span class="bl" title="${esc(it.label)}">${esc(it.label)}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(4, Math.round(it.v / max * 100))}%;${it.color ? "background:" + it.color : ""}"></span></span><span class="bv">${fmt ? fmt(it.v, it) : it.v}</span></div>`).join("")}</div>`;
}

// ---------- example data for the Insights preview (seeded, in memory only) ----------
function makeDemo(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const d = {checkins: [], sessions: []};
  const now = Date.now(), tagIds = ["work", "deadlines", "sleep", "family", "study", "money", "news"];
  const eff = {cyclic: 2.6, resonance: 2.2, pmr: 2.0, worry: 1.4, microbreak: 1.2, writing: 0.9, grounding: 1.7};
  const ids = Object.keys(eff);
  for (let day = 29; day >= 0; day--) {
    const base = startOfDay(now) - day * 864e5, trend = 6.2 - (29 - day) * 0.06;
    const n = rnd() < 0.75 ? 1 + (rnd() < 0.4 ? 1 : 0) : 0;
    for (let k = 0; k < n; k++) {
      const h = [9, 13, 16, 19, 22][Math.floor(rnd() * 5)];
      const lvl = clamp(Math.round(trend + (h >= 13 && h <= 16 ? 1 : 0) + (rnd() - 0.5) * 3), 0, 10);
      const tags = [tagIds[Math.floor(rnd() * 3)]]; if (rnd() < 0.4) tags.push(tagIds[3 + Math.floor(rnd() * 4)]);
      d.checkins.push({t: base + h * 36e5 + Math.floor(rnd() * 50) * 6e4, level: lvl, tags});
    }
    if (rnd() < 0.7) {
      const id = ids[Math.floor(rnd() * ids.length)], h = [8, 12, 17, 21][Math.floor(rnd() * 4)];
      const before = clamp(Math.round(trend + 0.5 + (rnd() - 0.5) * 3), 2, 10);
      const after = clamp(Math.round(before - eff[id] + (rnd() - 0.5) * 2), 0, 10);
      d.sessions.push({t: base + h * 36e5, tool: id, secs: 180 + Math.floor(rnd() * 360), before, after});
    }
  }
  d.checkins.sort((a, b) => a.t - b.t); d.sessions.sort((a, b) => a.t - b.t);
  return d;
}

function vInsights(){

  let o = `<header class="page-head"><h1>${esc(t("nav.insights"))}</h1><p class="lead">${esc(t("in.lead"))}</p></header>`;
  if (!has && !DEMO) {
    return o + `<section class="card" style="align-items:flex-start"><h2 class="h3">${esc(t("in.empty.title"))}</h2><p class="muted" style="max-width:62ch">${esc(t("in.empty.text"))}</p><div class="row"><button class="btn primary" data-act="demo-on">${ic("chart", "s")}${esc(t("in.empty.demo"))}</button><a class="btn" href="#home">${esc(t("nav.home"))}</a></div></section>`;
  }
  const d = data(), days = UI.range;
  if (DEMO) o += `<div class="demo-flag"><span>${ic("info", "s")} ${esc(t("in.demo.flag"))}</span><button class="btn sm" data-act="demo-off">${esc(t("in.demo.exit"))}</button></div>`;
  o += `<div class="row between"><div class="seg" role="group">${[7, 30, 90].map(n => `<button type="button" data-act="range" data-v="${n}" aria-pressed="${days === n}">${esc(t("in." + n))}</button>`).join("")}</div></div>`;
  const ch = inRange(d.checkins, days), se = inRange(d.sessions, days), rated = se.filter(s => s.before != null && s.after != null);
  const avg = rated.length ? rated.reduce((a, s) => a + (s.after - s.before), 0) / rated.length : null;
  const mins = Math.round(se.reduce((a, s) => a + (s.secs || 0), 0) / 60);
  o += `<div class="kpis"><div class="kpi"><b>${ch.length}</b><span>${esc(t("in.k.checkins"))}</span></div><div class="kpi"><b>${se.length}</b><span>${esc(t("in.k.sessions"))}</span></div><div class="kpi"><b>${mins}</b><span>${esc(t("in.k.minutes"))}</span></div><div class="kpi"><b style="color:${avg != null && avg < 0 ? "var(--calm)" : "var(--ink)"}">${avg == null ? "–" : (avg > 0 ? "+" : avg < 0 ? "−" : "") + Math.abs(avg).toFixed(1)}</b><span>${esc(t("in.k.change"))}</span></div></div>`;
  o += `<section class="card"><div class="card-head"><h2 class="h3">${esc(t("in.trend"))}</h2><span class="xs muted">${esc(t("in.trend.sub"))}</span></div><div class="chart" data-chart="trend">${readings(null, days).length ? "" : `<p class="muted small">${esc(t("in.noData"))}</p>`}</div></section>`;
  // what works
  const ts = toolStats({sessions: se});
  const works = Object.keys(ts).filter(k => ts[k].rated >= 2).map(k => ({label: toolName(k), v: ts[k].drop, n: ts[k].rated})).sort((a, b) => b.v - a.v);
  const maxW = Math.max(1, ...works.map(w => Math.abs(w.v)));
  // triggers
  const tc = {}; ch.forEach(c => (c.tags || []).forEach(g => { tc[g] = (tc[g] || 0) + 1; }));
  const trig = Object.keys(tc).map(k => ({label: L(TAGS.find(x => x.id === k) || {en: k}), v: tc[k]})).sort((a, b) => b.v - a.v).slice(0, 7);
  o += `<div class="grid-2 even">
    <section class="card"><h2 class="h3">${esc(t("in.works"))}</h2><p class="xs muted">${esc(t("in.works.sub"))}</p>${works.length ? barsHTML(works.map(w => ({...w, v: Math.max(0, w.v), raw: w.v})), maxW, (v, it) => (it.raw > 0 ? "−" : it.raw < 0 ? "+" : "") + Math.abs(it.raw).toFixed(1)) : `<p class="small muted">${esc(t("in.works.none"))}</p>`}</section>
    <section class="card"><h2 class="h3">${esc(t("in.triggers"))}</h2><p class="xs muted">${esc(t("in.triggers.sub"))}</p>${trig.length ? barsHTML(trig, Math.max(...trig.map(x => x.v)), v => v, null) : `<p class="small muted">${esc(t("in.triggers.none"))}</p>`}</section>
  </div>`;
  // time of day
  const buckets = {morning: [], afternoon: [], evening: [], night: []};
  readings(null, days).forEach(r => { const hr = new Date(r.t).getHours(); (hr >= 5 && hr < 12 ? buckets.morning : hr < 17 && hr >= 12 ? buckets.afternoon : hr >= 17 && hr < 22 ? buckets.evening : buckets.night).push(r.v); });
  const tod = Object.keys(buckets).filter(k => buckets[k].length).map(k => { const v = buckets[k].reduce((a, b) => a + b, 0) / buckets[k].length; return {label: t("tod." + k), v, color: lvColor(Math.round(v))}; });
  if (tod.length) o += `<section class="card"><div class="card-head"><h2 class="h3">${esc(t("in.time"))}</h2><span class="xs muted">${esc(t("in.time.sub"))}</span></div>${barsHTML(tod, 10, v => v.toFixed(1))}</section>`;
  return o;
}

function entryHTML(j){
  const kindKey = {writing: "jo.writing", thought: "jo.thought", good: "jo.good", todo: "jo.todo"}[j.kind];

    box: {in: ["br.in", "br.box.in"], hold: ["br.hold", "br.box.hold"], out: ["br.out", "br.box.out"]}
  }[type];

    <div class="phase-sub" id="phs">${esc(sos ? t("sos.breathe.sub") : t("br.ready.sub"))}</div>

  const controls = paused => `<button class="btn icon" data-act="r-prev" aria-label="${esc(t("st.prev"))}" title="${esc(t("st.prev"))}">${ic("left", "flip")}</button>${pauseBtn(paused)}<button class="btn icon" data-act="r-next" aria-label="${esc(t("st.skip"))}" title="${esc(t("st.skip"))}">${ic("right", "flip")}</button>`;
  ctx.bottom.innerHTML = controls(false);
  const total = list.reduce((a, s) => a + s.d, 0);
  function show(){
    const s = list[i];
    $("#stt").textContent = s.title; $("#stx").textContent = s.text;
    $("#rk").textContent = s.kind === "tense" ? t("st.tense") : s.kind === "release" ? t("st.release") : t("st.of", {a: s.g + 1, b: groups});
    $("#ring").classList.toggle("tense", s.kind === "tense");
    $$("#sb i").forEach((b, k) => { b.className = k < s.g ? "done" : k === s.g ? "now" : ""; });
    Snd.cue(s.kind === "tense" ? "tense" : s.kind === "release" ? "release" : "step");
    announce(s.title + ". " + s.text);
  }
  const clock = pausable(T => {
    if (finished) return;
    let s = list[i], el = T - stepStart;
    if (el >= s.d) {
      if (i >= list.length - 1) { finished = true; clock.stop(); Snd.cue("end"); setTimeout(() => ctx.done(), 600); return; }
      i++; stepStart = T; s = list[i]; el = 0;
    }
    if (i !== lastI) { lastI = i; show(); }
    const rem = s.d - el;
    $("#rn").textContent = Math.ceil(rem);
    $("#rfg").setAttribute("stroke-dashoffset", (C * (1 - rem / s.d)).toFixed(2));
    const left = list.slice(i + 1).reduce((a, x) => a + x.d, 0) + rem;
    ctx.sub(t("s.left", {t: fmtClock(left)}));
  });
  const api = {
    get paused(){ return clock.paused; },
    pause(){ clock.pause(); ctx.bottom.innerHTML = controls(true); },
    resume(){ clock.resume(); ctx.bottom.innerHTML = controls(false); },
    toggle(){ clock.paused ? api.resume() : api.pause(); },
    sync(){ ctx.bottom.innerHTML = controls(clock.paused); },
    jump(dir){ const T = clock.T(); i = clamp(i + dir, 0, list.length - 1); stepStart = T; lastI = -1; if (clock.paused) { show(); lastI = i; $("#rn").textContent = list[i].d; $("#rfg").setAttribute("stroke-dashoffset", "0"); } },
    stop(){ clock.stop(); }, pausedSecs: () => clock.pausedSecs(), autoPause: true, total
  };
  return api;
};

// worry parking and the worry window
RUNNERS.worry = ctx => {

      <div class="s-card"><h3 style="overflow-wrap:anywhere">${esc(w ? w.text : "")}</h3><p class="muted">${esc(t("wo.canAct"))}</p>

    setTimeout(() => { const f = $("#wo-step") || $(".s-card .btn"); if (f) f.focus(); }, 40);
  }
  const nextW = () => { cur = queue.shift() || null; planning = false; paintWindow(); };
  if (mode === "window") startWindow(); else paintPark();
  return {
    park(text){ text = (text || "").trim(); if (!text) return; S.worries.push({id: uid(), t: Date.now(), text, status: "parked"}); save(); toast(t("wo.parked")); paintPark(); renderChrome(); },
    del(id){ S.worries = S.worries.filter(w => w.id !== id); save(); paintPark(); renderChrome(); },

    unplan(){ planning = false; paintWindow(); },
    savePlan(text){ text = (text || "").trim(); if (!text) return; const w = S.worries.find(x => x.id === cur); if (w) w.status = "planned"; S.steps.push({id: uid(), t: Date.now(), text, when: "", done: false}); save(); toast(t("wo.stepSaved")); nextW(); },
    letgo(){ const w = S.worries.find(x => x.id === cur); if (w) w.status = "letgo"; save(); Snd.cue("out"); nextW(); },
    keep(){ nextW(); },
    finish(){ clearInterval(timer); renderChrome(); ctx.done(); },
    stop(){ clearInterval(timer); }
  };
};

    if (step === 3) body = ta("th-friend", t("th.friend"), "", d.friend, 3) + ta("th-self", t("th.self"), nm ? t("th.self.ph", {name: nm}) : t("th.self.ph0"), d.self, 3);
    if (step === 4) body = ta("th-balanced", t("th.balanced"), t("th.balanced.ph"), d.balanced, 4);
    if (step === 5) body = `<div class="s-card">${[["jo.f.situation", d.situation], ["jo.f.thought", d.thought], ["jo.f.balanced", d.balanced]].filter(x => x[1]).map(x => `<div class="stack" style="gap:2px"><span class="xs muted">${esc(t(x[0]))}</span><p style="overflow-wrap:anywhere">${esc(x[1])}</p></div>`).join("") || `<p class="muted">…</p>`}</div>`;

};

      if (it.zone === "out") extra = `<span class="label">${esc(t("co.out.q"))}</span><div class="chips">${["breathe", "talk", "accept"].map(c => `<button type="button" class="chip" data-act="co-cope" data-c="${c}" aria-pressed="${it.cope === c}">${esc(t("co.out." + c))}</button>`).join("")}</div>`;
      ctx.stage.innerHTML = `<div class="s-panel"><span class="eyebrow" style="color:var(--focus-dim)">${esc(t("st.of", {a: i + 1, b: items.length}))}</span><h2 class="s-q" style="align-self:flex-start;text-align:start;max-width:none;overflow-wrap:anywhere">${esc(it.text)}</h2><div class="zones">${zone("act", t("co.zone.act"), t("co.zone.act.d"))}${zone("infl", t("co.zone.infl"), t("co.zone.infl.d"))}${zone("out", t("co.zone.out"), t("co.zone.out.d"))}</div>${extra}</div>`;
      ctx.bottom.innerHTML = `<button class="btn" data-act="co-back">${ic("left", "s flip")}${esc(t("s.back"))}</button><button class="btn primary" data-act="co-next" ${it.zone ? "" : "disabled"}>${esc(t("s.next"))}${ic("right", "s flip")}</button>`;
    } else {
      const plans = items.filter(x => (x.zone === "act" || x.zone === "infl") && x.step.trim());
      const outs = items.filter(x => x.zone === "out");
      ctx.stage.innerHTML = `<div class="s-panel"><h2 class="s-q" style="align-self:center">${esc(t("co.summary"))}</h2>
        ${plans.length ? `<div class="s-card">${plans.map(p => `<div class="stack" style="gap:2px"><span class="xs muted" style="overflow-wrap:anywhere">${esc(p.text)}</span><p style="overflow-wrap:anywhere">${esc(p.when.trim() ? t("co.ifthen", {when: p.when.trim().replace(/^(if|إذا)\s*/i, ""), step: p.step.trim()}) : p.step.trim())}</p></div>`).join("")}</div>` : ""}
        ${outs.length ? `<div class="s-card">${outs.map(p => `<div class="stack" style="gap:2px"><span class="xs muted" style="overflow-wrap:anywhere">${esc(p.text)}</span><p>${esc(p.cope ? t("co.out." + p.cope) : t("co.zone.out"))}</p></div>`).join("")}</div>` : ""}</div>`;
      ctx.bottom.innerHTML = `<button class="btn" data-act="co-back">${ic("left", "s flip")}${esc(t("s.back"))}</button><button class="btn primary" data-act="co-save">${ic("check", "s")}${esc(plans.length ? t("co.save") : t("s.finish"))}</button>`;
    }
  }
  paint();
  return {
    add(text){ text = (text || "").trim(); if (!text) return; items.push({text, zone: null, step: "", when: "", cope: null}); paint(); },
    del(k){ items.splice(+k, 1); paint(); },
    sort(){ mode = "sort"; i = 0; paint(); },
    zone(z){ grab(); items[i].zone = z; paint(); },
    cope(c){ items[i].cope = c; paint(); },
    next(){ grab(); if (i < items.length - 1) { i++; } else mode = "sum"; paint(); },
    back(){ grab(); if (mode === "sum") { mode = "sort"; i = items.length - 1; } else if (i > 0) i--; else mode = "add"; paint(); },
    save(){
      const plans = items.filter(x => (x.zone === "act" || x.zone === "infl") && x.step.trim());
      plans.forEach(p => S.steps.push({id: uid(), t: Date.now(), text: p.step.trim(), when: p.when.trim(), done: false}));
      if (plans.length) { save(); toast(t("co.saved")); }
      ctx.done();
    },
    stop(){}
  };
};

// nature break: outdoors timer or generated soundscape
RUNNERS.nature = ctx => {
  let mode = "choose", kind = "waves", mins = 10, outMins = 20, start = 0, timer = 0, raf = 0, playing = false;
  const stopAll = () => { clearInterval(timer); cancelAnimationFrame(raf); if (playing) { Snd.stopNature(); playing = false; } };
  function paint(){
    ctx.stage.className = "stage";
    if (mode === "choose") {
      ctx.stage.innerHTML = `<div class="s-panel"><div class="s-card"><h3>${esc(t("na.out"))}</h3><p class="muted">${esc(t("na.out.d"))}</p><div class="row"><div class="seg" role="group">${[20, 30].map(n => `<button type="button" data-act="na-outmins" data-v="${n}" aria-pressed="${outMins === n}">${esc(pl("min", n))}</button>`).join("")}</div><button class="btn primary" data-act="na-out">${ic("leaf", "s")}${esc(t("s.begin"))}</button></div></div>
        <div class="s-card"><h3>${esc(t("na.sound"))}</h3><p class="muted">${esc(t("na.sound.d"))}</p>${Snd.ok() ? `<div class="chips">${["waves", "rain", "wind", "brown"].map(k => `<button type="button" class="chip" data-act="na-kind" data-v="${k}" aria-pressed="${kind === k}">${esc(t("na." + k))}</button>`).join("")}</div><div class="row"><div class="seg" role="group">${[5, 10, 20].map(n => `<button type="button" data-act="na-mins" data-v="${n}" aria-pressed="${mins === n}">${esc(pl("min", n))}</button>`).join("")}</div><button class="btn primary" data-act="na-play">${ic("play", "s")}${esc(t("s.begin"))}</button></div>` : `<p class="muted small">${esc(t("na.noaudio"))}</p>`}</div></div>`;
      ctx.bottom.innerHTML = "";
      return;
    }
    const total = (mode === "out" ? outMins : mins) * 60;
    ctx.stage.innerHTML = `<div class="nature-viz"><canvas id="na-cv" aria-hidden="true"></canvas></div>
      <p class="s-p">${esc(mode === "out" ? t("na.outside") : t("na.sound.d"))}</p>
      ${mode === "sound" ? `<div class="chips" style="justify-content:center">${["waves", "rain", "wind", "brown"].map(k => `<button type="button" class="chip" data-act="na-kind" data-v="${k}" aria-pressed="${kind === k}">${esc(t("na." + k))}</button>`).join("")}</div><label class="row small muted" style="width:min(320px,100%)">${ic("sound", "s")}<span class="sr">${esc(t("na.vol"))}</span><input type="range" id="na-vol" min="0" max="1" step="0.05" value="${S.settings.vol}"></label>` : ""}`;
    ctx.bottom.innerHTML = `<button class="btn primary" data-act="r-finish">${esc(t("s.finish"))}</button>`;
    start = Date.now();
    clearInterval(timer);
    timer = setInterval(() => {
      const left = total - (Date.now() - start) / 1000;
      ctx.sub(t("na.ends", {t: fmtClock(left)}));
      if (left <= 0) { clearInterval(timer); Snd.cue("end"); setTimeout(() => api.finish(), 800); }
    }, 500);
    animate();
  }
  function animate(){
    const cv = $("#na-cv"); if (!cv) return;
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const colA = css("--trace"), colB = css("--exhale");
    const frame = now => {
      const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
      if (W && H) {
        if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
        const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
        const tt = reduce ? 0 : now / 1000;
        for (let L2 = 0; L2 < 4; L2++) {
          g.beginPath();
          const amp = 8 + L2 * 4, base = H * (0.42 + L2 * 0.13), sp = 0.25 + L2 * 0.08;
          for (let x = 0; x <= W; x += 4) { const y = base + Math.sin(x / (90 + L2 * 30) + tt * sp + L2) * amp + Math.sin(x / 37 + tt * sp * 1.7) * 2; x ? g.lineTo(x, y) : g.moveTo(x, y); }
          g.strokeStyle = rgba(L2 % 2 ? colB : colA, 0.55 - L2 * 0.1); g.lineWidth = 2; g.stroke();
        }
      }
      if (!reduce) raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }
  paint();
  const api = {
    kind(k){ kind = k; if (mode === "sound") { Snd.startNature(kind); playing = true; $$("[data-act='na-kind']").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === k))); } else paint(); },
    mins(n){ mins = +n; paint(); }, outMins(n){ outMins = +n; paint(); },
    play(){ mode = "sound"; if (Snd.startNature(kind)) playing = true; paint(); },
    out(){ mode = "out"; paint(); },
    finish(){ stopAll(); ctx.done(); },
    stop: stopAll
  };
  return api;
};

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const act = a.dataset.act, id = a.dataset.id, v = a.dataset.v;
  const R = Sess.cur && Sess.cur.runner;
  switch (act) {
    // ----- today / shared -----
    case "scale": {
      const val = +v, nm = a.dataset.name;
      if (nm === "check") { UI.check = val; paintScale("check", val); const b = $("[data-act='save-check']"); if (b) b.disabled = false; }
      else if (Sess.cur) {
        if (nm === "before") { Sess.cur.before = val; paintScale("before", val); const b = $("[data-act='s-begin']"); if (b) b.disabled = false; }
        if (nm === "after") { Sess.cur.after = val; paintScale("after", val); const b = $("[data-act='s-save-after']"); if (b) b.disabled = false; }
      }
      break;
    }
    case "tag": { const i = UI.tags.indexOf(id); if (i >= 0) UI.tags.splice(i, 1); else UI.tags.push(id); a.setAttribute("aria-pressed", String(i < 0)); break; }
    case "save-check":
      if (UI.check == null) return;
      S.checkins.push({t: Date.now(), level: UI.check, tags: UI.tags.slice()}); save();
      if (!UI.state) UI.state = UI.check >= 8 ? "tense" : null;
      UI.check = null; UI.tags = []; toast(t("today.saved")); render(); break;
    case "state": UI.state = UI.state === id ? null : id; $$("[data-act='state'].state").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === UI.state))); $("#recs").innerHTML = recsHTML(); break;
    case "sos": Sess.sos(); break;
    case "welcome-ok": S.settings.welcomed = true; save(); render(); break;
    case "start": Sess.open(id, {mode: a.dataset.mode}); break;
    case "open-window": Sess.open("worry", {mode: "window", noRate: false}); break;
    case "opt": { const o = topt(a.dataset.tool); o[a.dataset.k] = isNaN(+v) ? v : +v; save(); renderView("tool", a.dataset.tool); break; }
    case "pin": { const i = S.pins.indexOf(id); if (i >= 0) { S.pins.splice(i, 1); toast(t("detail.unpinned")); } else { S.pins.push(id); toast(t("detail.pinned")); } save(); renderView("tool", id); break; }
    case "steps-clear": S.steps = S.steps.filter(s => !s.done); save(); render(); break;
    // ----- tools -----
    case "cat": UI.f.cat = v; render(); break;
    case "time": UI.f.time = v; render(); break;
    case "clear-filters": UI.f = {cat: "all", time: "any", q: ""}; render(); break;
    // ----- insights / journal -----
    case "range": UI.range = +v; render(); break;
    case "demo-on": DEMO = makeDemo(); render(); break;
    case "demo-off": DEMO = null; render(); break;
    case "jo": UI.jo = v; render(); break;
    case "jo-del": S.journal = S.journal.filter(j => j.id !== id); save(); toast(t("jo.deleted")); render(); break;
    case "jo-more": UI.joOpen[id] = !UI.joOpen[id]; render(); break;
    // ----- settings -----
    case "lang": S.settings.lang = v; save(); render(); break;
    case "theme": S.settings.theme = v; save(); render(); break;
    case "sound": S.settings.sound = !S.settings.sound; save(); render(); break;
    case "ratings": S.settings.ratings = !S.settings.ratings; save(); render(); break;
    case "motion": S.settings.motion = v; save(); render(); break;
    case "worry-len": S.settings.worryLen = +v; save(); render(); break;
    case "notif": if ("Notification" in window) Notification.requestPermission().then(() => render()).catch(() => {}); break;
    case "csv": exportCSV(); break;
    case "backup": deliver("unknot-backup.json", JSON.stringify({app: "unknot", v: 1, exported: new Date().toISOString(), data: S}, null, 1), "application/json"); break;

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, R = Sess.cur && Sess.cur.runner; if (!R) return;
  if (f.id === "wo-form") { R.park($("#wo-in").value); }
  if (f.id === "wo-plan") { R.savePlan($("#wo-step").value); }
  if (f.id === "co-form") { R.add($("#co-in").value); }
  if (f.id === "td-form") { R.add($("#td-in").value); }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "tool-q") { UI.f.q = el.value; $("#tool-results").innerHTML = toolResults(); }
  if (el.id === "my-name") { S.settings.name = el.value.slice(0, 40); save(); }
  if (el.id === "vol" || el.id === "na-vol") { S.settings.vol = +el.value; Snd.setVol(S.settings.vol); save(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === "step-done") { const s = S.steps.find(x => x.id === el.dataset.id); if (s) { s.done = el.checked; save(); el.closest(".check-item").classList.toggle("done", el.checked); } }
  if (el.id === "worry-time" && el.value) { S.settings.worryTime = el.value; S.settings.worryNotified = ""; save(); }
  if (el.id === "break-every") { S.settings.breakEvery = +el.value; Rem.last = Date.now(); save(); }
  if (el.id === "restore-file" && el.files && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        if (!o || o.app !== "unknot" || !o.data) throw 0;
        const d = defaults();
        for (const k of Object.keys(d)) if (Array.isArray(d[k]) && Array.isArray(o.data[k])) d[k] = o.data[k];
        if (o.data.settings) Object.assign(d.settings, o.data.settings);
        S = d; saveNow(); toast(t("se.restored")); render();
      } catch (err) { toast(t("se.restoreBad")); }
    };
    rd.readAsText(el.files[0]);
    el.value = "";
  }
});

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  const sc = e.target.closest && e.target.closest("[data-scale]");
  if (sc && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault();
    const btns = $$("button", sc), cur = btns.findIndex(b => b.getAttribute("aria-checked") === "true");
    const next = clamp((cur < 0 ? 5 : cur) + (e.key === "ArrowRight" || e.key === "ArrowUp" ? 1 : -1), 0, 10);
    btns[next].click(); btns[next].focus(); return;
  }
  if (Sess.cur) {
    if (e.key === "Escape") { e.preventDefault(); if (Sess.bottom && Sess.bottom.dataset.confirm) Sess.endNo(); else Sess.askEnd(); }
    else if ((e.key === " " || e.code === "Space") && !typing && !(e.target.closest && e.target.closest("button"))) { e.preventDefault(); Sess.toggle(); }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "s" || e.key === "S") { e.preventDefault(); Sess.sos(); return; }
  const map = {"1": "home", "2": "tools", "3": "insights", "4": "journal"};
  if (map[e.key]) setHash("#" + map[e.key]);
});

document.addEventListener("visibilitychange", () => {
  const r = Sess.cur && Sess.cur.runner;
  if (document.hidden && r && r.autoPause && !r.paused && r.pause) r.pause();
});
window.addEventListener("hashchange", () => {
  const r = route();
  if (Sess.cur && r.v !== "sos" && r.v !== "start") return;
  render(true);
});
let resizeT = 0;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (route().v === "insights") drawCharts(); }, 150); });
if (window.matchMedia) { try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme()); } catch (e) {} }

// ---------- export ----------
function deliver(name, text, type){
  if (!IN_FRAME && download(name, text, type)) { toast(t("se.exported")); return; }
  copyText(text).then(ok => toast(ok ? t("se.exportFail") : t("ro.copyFail")));
}
function exportCSV(){
  const q = x => { const s = String(x == null ? "" : x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const time = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const rows = [["type", "date", "time", "technique", "seconds", "before", "after", "level", "tags"]];
  S.checkins.forEach(c => rows.push(["check-in", dayKey(c.t), time(c.t), "", "", "", "", c.level, (c.tags || []).join(" ")]));
  S.sessions.forEach(s => rows.push(["session", dayKey(s.t), time(s.t), s.tool === "sos" ? "Calm down now" : (tool(s.tool) ? tool(s.tool).en.name : s.tool), s.secs || 0, s.before == null ? "" : s.before, s.after == null ? "" : s.after, "", ""]));
  rows.sort((a, b) => a[0] === "type" ? -1 : b[0] === "type" ? 1 : (a[1] + a[2]).localeCompare(b[1] + b[2]));
  deliver("unknot-data.csv", "﻿" + rows.map(r => r.map(q).join(",")).join("\n"), "text/csv");
}

// ---------- reminders (while the app is open) ----------
const Rem = {
  last: Date.now(),
  tick(){
    const st = S.settings;
    if (Sess.cur) { this.last = Date.now(); return; }
    if (st.breakEvery > 0 && Date.now() - this.last >= st.breakEvery * 6e4) { this.last = Date.now(); this.show("break"); }
    if (S.worries.some(w => w.status === "parked") && worryDue() && st.worryNotified !== dayKey(Date.now())) { st.worryNotified = dayKey(Date.now()); save(); this.show("worry"); }
  },
  show(kind){
    const title = t(kind === "break" ? "rem.break.title" : "rem.worry.title"), text = t(kind === "break" ? "rem.break.text" : "rem.worry.text");
    if (document.hidden && "Notification" in window && Notification.permission === "granted") {
      try {
        const n = new Notification(title, {body: text, icon: "icons/icon-192.png", tag: "unknot-" + kind});
        n.onclick = () => { try { window.focus(); } catch (e) {} n.close(); $("#reminder-slot").innerHTML = ""; kind === "break" ? Sess.open("microbreak") : Sess.open("worry", {mode: "window"}); };
      } catch (e) {}
    }
    $("#reminder-slot").innerHTML = `<div class="reminder" role="status">${ic(kind === "break" ? "pulse" : "park")}<b>${esc(title)}</b><span class="small muted">${esc(text)}</span><div class="row"><button class="btn primary sm" data-act="rem-start" data-id="${kind}">${esc(t("rem.start"))}</button><button class="btn sm ghost" data-act="rem-later">${esc(t("rem.later"))}</button></div></div>`;
  }
};
setInterval(() => Rem.tick(), 30000);

// ---------- start ----------
function boot(){
  prepContent();
  const h = (location.hash || "").replace(/^#/, "");
  if (h.indexOf("start-") === 0 && tool(h.slice(6))) {
    const id = h.slice(6);
    try { history.replaceState(null, "", "#tool-" + id); } catch (e) {}
    render(); Sess.open(id);
  } else render();
  if ("serviceWorker" in navigator && !IN_FRAME && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
}
boot();

})();
</script>
